<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>情緒大冒險 — 學生回答列印報告</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Noto Sans TC', 'Arial', sans-serif; background: #f1f5f9; color: #1e293b; }

        /* ── 工具列（列印時隱藏） ── */
        #toolbar {
            position: sticky; top: 0; z-index: 100;
            background: #4338ca; color: white;
            padding: 14px 32px; display: flex; align-items: center; justify-content: space-between;
            box-shadow: 0 4px 16px rgba(67,56,202,0.3);
        }
        #toolbar h1 { font-size: 1.2rem; font-weight: 900; }
        #toolbar .meta { font-size: 0.82rem; opacity: 0.75; margin-top: 3px; }
        .btn-print {
            background: white; color: #4338ca; border: none;
            padding: 9px 26px; border-radius: 999px;
            font-size: 1rem; font-weight: 900; cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15); transition: transform 0.1s;
        }
        .btn-print:active { transform: scale(0.96); }

        /* ── 載入中 ── */
        #loading {
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; min-height: 60vh; gap: 16px;
            color: #64748b; font-size: 1.2rem; font-weight: 700;
        }
        .spinner {
            width: 48px; height: 48px;
            border: 5px solid #e2e8f0; border-top-color: #4338ca;
            border-radius: 50%; animation: spin 0.8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── 報告外框（螢幕預覽用） ── */
        #report { padding: 24px 0 60px; }

        /* ── 每位學生 = 一張 A4 ── */
        .student-page {
            width: 210mm;
            min-height: 297mm;
            margin: 0 auto 32px;
            background: white;
            box-shadow: 0 4px 24px rgba(0,0,0,0.10);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* 頁首 */
        .page-header {
            background: linear-gradient(135deg, #4338ca 0%, #6366f1 100%);
            color: white;
            padding: 22px 32px 18px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
        }
        .header-left { display: flex; flex-direction: column; gap: 4px; }
        .class-label { font-size: 0.78rem; font-weight: 700; opacity: 0.75; letter-spacing: 0.08em; }
        .student-name { font-size: 2rem; font-weight: 900; letter-spacing: 0.05em; }
        .header-right { text-align: right; }
        .score-badge {
            background: rgba(255,255,255,0.22);
            padding: 8px 20px; border-radius: 999px;
            font-weight: 900; font-size: 1rem;
            display: inline-block; margin-bottom: 6px;
        }
        .date-label { font-size: 0.75rem; opacity: 0.7; }

        /* 裝飾線 */
        .header-stripe {
            height: 5px;
            background: repeating-linear-gradient(90deg, #fbbf24 0px, #fbbf24 20px, #f59e0b 20px, #f59e0b 40px);
            flex-shrink: 0;
        }

        /* 回答內容區 */
        .page-body { padding: 20px 28px 20px; flex: 1; display: flex; flex-direction: column; gap: 10px; }

        .answer-row {
            display: grid;
            grid-template-columns: 40px 1fr;
            gap: 10px;
            align-items: start;
            padding: 10px 14px;
            background: #f8fafc;
            border-radius: 12px;
            border-left: 4px solid #6366f1;
        }
        .answer-emoji { font-size: 1.6rem; text-align: center; padding-top: 2px; line-height: 1; }
        .answer-level {
            display: inline-block; background: #eef2ff; color: #4338ca;
            font-size: 0.68rem; font-weight: 900; padding: 2px 7px;
            border-radius: 5px; margin-right: 5px; vertical-align: middle;
        }
        .answer-scenario {
            font-size: 0.75rem; color: #94a3b8; font-weight: 700;
            margin-bottom: 5px; line-height: 1.4;
        }
        .answer-text {
            font-size: 0.95rem; font-weight: 700; color: #1e293b; line-height: 1.65;
            background: white; padding: 8px 12px; border-radius: 9px;
            border: 1.5px solid #e2e8f0;
        }
        .answer-text::before { content: '\300C'; color: #6366f1; }
        .answer-text::after  { content: '\300D'; color: #6366f1; }

        .no-answer {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 12px;
            color: #cbd5e1; font-size: 1.1rem; font-style: italic;
            padding: 40px 0;
        }
        .no-answer-icon { font-size: 3rem; }

        /* 頁尾 */
        .page-footer {
            border-top: 2px dashed #e2e8f0;
            padding: 10px 28px;
            display: flex; align-items: center; justify-content: space-between;
            flex-shrink: 0;
        }
        .footer-brand { font-size: 0.72rem; color: #cbd5e1; font-weight: 700; letter-spacing: 0.1em; }
        .footer-stars { display: flex; gap: 3px; }
        .footer-stars span { font-size: 0.9rem; }

        /* ── 列印樣式 ── */
        @media print {
            @page { size: A4; margin: 0; }
            body { background: white; }
            #toolbar { display: none !important; }
            #report { padding: 0; }
            .student-page {
                width: 210mm;
                min-height: 297mm;
                height: 297mm;
                margin: 0;
                box-shadow: none;
                page-break-after: always;
                break-after: page;
            }
            .student-page:last-child {
                page-break-after: avoid;
                break-after: avoid;
            }
            .page-header, .header-stripe, .answer-row, .score-badge, .answer-level {
                -webkit-print-color-adjust: exact;
                print-color-adjust: exact;
            }
        }
    </style>
</head>
<body>

<div id="toolbar">
    <div>
        <h1>📋 情緒大冒險 — 學生回答報告（一人一頁）</h1>
        <div class="meta" id="toolbar-meta">資料載入中⋯⋯</div>
    </div>
    <button class="btn-print" onclick="window.print()">🖨️ 列印 / 存成 PDF</button>
</div>

<div id="loading">
    <div class="spinner"></div>
    <p>正在從雲端讀取學生資料⋯⋯</p>
</div>

<div id="report" style="display:none;"></div>

<script>
const firebaseConfig = {
    apiKey: "AIzaSyBdioCJeP0FbZvX_opzhrgsgQ5OtQR5J_Y",
    authDomain: "emotionadventure-bca46.firebaseapp.com",
    projectId: "emotionadventure-bca46",
    storageBucket: "emotionadventure-bca46.firebasestorage.app",
    messagingSenderId: "255312343191",
    appId: "1:255312343191:web:ac90f2cbb36296edbdf9d2"
};

const CHARACTERS = ["沄恩","澄洋","意欣","宇晴","齊安","欽銓","盧楷"];
const DB_COLLECTION = "ClassRecords_V12";
const SCENARIOS = [
    { emoji:"🚫", text:"下課時我想加入同學的遊戲，但他們說「我們不要你」，我好難過。" },
    { emoji:"😤", text:"我和好朋友因為一點小事吵架了，我們現在都不說話。" },
    { emoji:"😢", text:"考試卷發下來，我的成績很差，我覺得很沮喪想哭。" },
    { emoji:"😡", text:"有同學一直嘲笑我的名字或外表，我覺得很生氣又很受傷。" },
    { emoji:"😰", text:"我不小心打破了教室裡的東西，很害怕被老師責罵。" },
    { emoji:"🤔", text:"我看到一個同學在走廊被另一個同學推來推去，但我不知道該怎麼辦。" },
    { emoji:"😖", text:"老師誤會是我做的，但其實不是我，我覺得好委屈。" },
    { emoji:"🤕", text:"體育課跑步時我跌倒了，膝蓋破皮很痛，眼眶紅紅的。" },
    { emoji:"😣", text:"分組活動時，我沒有被任何一組選到，一個人站在那裡很尷尬。" },
    { emoji:"🎁", text:"同學帶了一個很酷的新玩具來學校，我非常想要玩，但那是他的。" }
];

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
firebase.auth().signInAnonymously().catch(()=>{});

function escapeHTML(str) {
    return String(str)
        .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;').replace(/\n/g,'<br>');
}

function starsHTML(count, total) {
    let s = '';
    for (let i = 0; i < total; i++) {
        s += `<span style="color:${i < count ? '#fbbf24' : '#e2e8f0'}">★</span>`;
    }
    return s;
}

function renderReport(allProgress) {
    const now = new Date();
    const dateStr = now.getFullYear() + '/' + (now.getMonth()+1) + '/' + now.getDate();
    const timeStr = now.getHours() + ':' + now.getMinutes().toString().padStart(2,'0');

    let totalAnswers = 0, studentsAnswered = 0;
    CHARACTERS.forEach(name => {
        const c = allProgress[name]?.completed?.length || 0;
        totalAnswers += c;
        if (c > 0) studentsAnswered++;
    });

    let pagesHTML = '';

    CHARACTERS.forEach(name => {
        const prog = allProgress[name] || { completed:[], records:{} };
        const count = prog.completed?.length || 0;
        const sorted = [...(prog.completed||[])].sort((a,b)=>a-b);

        // 回答內容
        let bodyHTML = '';
        if (count === 0) {
            bodyHTML = `
                <div class="no-answer">
                    <div class="no-answer-icon">📝</div>
                    <div>此同學目前尚無作答紀錄</div>
                </div>`;
        } else {
            sorted.forEach(idx => {
                const s = SCENARIOS[idx];
                const ans = prog.records?.[idx] || '（無文字紀錄）';
                bodyHTML += `
                    <div class="answer-row">
                        <div class="answer-emoji">${s.emoji}</div>
                        <div>
                            <div class="answer-scenario">
                                <span class="answer-level">第 ${idx+1} 關</span>${s.text}
                            </div>
                            <div class="answer-text">${escapeHTML(ans)}</div>
                        </div>
                    </div>`;
            });
        }

        pagesHTML += `
            <div class="student-page">
                <div class="page-header">
                    <div class="header-left">
                        <div class="class-label">情緒大冒險 · 學生作答紀錄</div>
                        <div class="student-name">✦ ${name}</div>
                    </div>
                    <div class="header-right">
                        <div class="score-badge">完成 ${count} / ${SCENARIOS.length} 關</div>
                        <div class="date-label">列印時間：${dateStr} ${timeStr}</div>
                    </div>
                </div>
                <div class="header-stripe"></div>
                <div class="page-body">${bodyHTML}</div>
                <div class="page-footer">
                    <div class="footer-brand">EMOTION ADVENTURE · DUAL ENGINE</div>
                    <div class="footer-stars">${starsHTML(count, SCENARIOS.length)}</div>
                </div>
            </div>`;
    });

    document.getElementById('report').innerHTML = pagesHTML;
    document.getElementById('report').style.display = 'block';
    document.getElementById('loading').style.display = 'none';
    document.getElementById('toolbar-meta').textContent =
        `共 ${CHARACTERS.length} 位同學 × ${studentsAnswered} 人已作答 × 總計 ${totalAnswers} 則回應 × ${dateStr} ${timeStr}`;
}

function loadData() {
    db.collection('GameData').doc(DB_COLLECTION).get()
        .then(snap => {
            let data = {};
            if (snap.exists && snap.data().students) {
                data = snap.data().students;
            } else {
                try { data = JSON.parse(localStorage.getItem('emotion_adventure_data_v2')||'{}'); } catch(e){}
            }
            renderReport(data);
        })
        .catch(() => {
            let data = {};
            try { data = JSON.parse(localStorage.getItem('emotion_adventure_data_v2')||'{}'); } catch(e){}
            renderReport(data);
        });
}

window.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>
