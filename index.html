<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>情緒大冒險 - 語音互動點名版</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React, ReactDOM, Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        body, html { 
            margin: 0; padding: 0; height: 100vh; width: 100vw; 
            overflow: hidden; 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #F8FAFC;
            user-select: none;
            -webkit-touch-callout: none;
        }
        #root { height: 100%; width: 100%; }
        
        .selected-frame {
            border-color: #ef4444 !important; 
            box-shadow: 0 0 50px rgba(239, 68, 68, 0.5);
            transform: scale(1.08);
            z-index: 20;
        }

        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes star-pop {
            0% { transform: scale(0); }
            80% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }
        .star-animate { animation: star-pop 0.5s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const CHARACTERS = ["宇晴", "澄洋", "沄恩", "盧楷", "欽銓", "齊安", "意欣"];

        const SCENARIOS = [
            { id: 1, text: "我和同學玩遊戲輸了，我覺得心裡酸酸的。", emoji: "🎮", hint: "輸掉遊戲時，你會怎麼跟自己說？" },
            { id: 2, text: "今天早上我上課遲到了，進教室時看到大家都在看我。", emoji: "⏰", hint: "遲到的時候，你想跟老師說什麼？" },
            { id: 3, text: "上課要寫字時，我發現我忘了帶鉛筆盒。", emoji: "✏️", hint: "沒帶工具時，該怎麼辦呢？" },
            { id: 4, text: "老師叫我上台發表，但我好害羞，不敢看大家。", emoji: "🫣", hint: "心裡很緊張的時候，可以做什麼動作？" },
            { id: 5, text: "下課排隊玩溜滑梯，前面的同學動作好慢喔。", emoji: "⏳", hint: "等待的時候，心裡可以想些什麼？" },
            { id: 6, text: "同學不小心撞到我，他趕快跟我說對不起。", emoji: "🕊️", hint: "對方道歉了，你會怎麼回應他？" },
            { id: 7, text: "教室裡面突然好吵好大聲，我覺得耳朵痛痛的。", emoji: "🙉", hint: "覺得不舒服時，你會怎麼尋求幫忙？" },
            { id: 8, text: "我畫了一張好漂亮的畫，老師把它貼在公佈欄給大家看。", emoji: "🖼️", hint: "被稱讚的時候，你現在的心情是..." },
            { id: 9, text: "午餐的湯不小心灑在衣服上了，濕濕黏黏的。", emoji: "🥣", hint: "衣服髒了很不舒服，該怎麼解決呢？" },
            { id: 10, text: "同學跟我借彩色筆，我也借給他一起用。", emoji: "🖍️", hint: "分享東西給別人，你覺得現在的心情是..." }
        ];

        function App() {
            const [gameState, setGameState] = useState('CHARACTER_SELECT'); 
            const [selectedCharacter, setSelectedCharacter] = useState(null);
            const [isSpinning, setIsSpinning] = useState(false);
            const [spinIndex, setSpinIndex] = useState(-1);
            const [currentLevelIdx, setCurrentLevelIdx] = useState(0);
            const [isListening, setIsListening] = useState(false);
            const [transcript, setTranscript] = useState('');
            const [feedback, setFeedback] = useState({ type: '', message: '' });
            
            // 全局進度儲存：儲存每位學生的過關情況與錄音文字
            const [allProgress, setAllProgress] = useState(() => {
                const init = {};
                CHARACTERS.forEach(c => init[c] = { completed: [], records: {} });
                return init;
            });

            const [currentTime, setCurrentTime] = useState('');
            const recognitionRef = useRef(null);
            const spinRef = useRef(null);
            const currentLevelIdxRef = useRef(0);

            useEffect(() => { currentLevelIdxRef.current = currentLevelIdx; }, [currentLevelIdx]);

            // 時鐘更新
            useEffect(() => {
                const updateClock = () => {
                    const now = new Date();
                    const hours = now.getHours();
                    const ampm = hours >= 12 ? '下午' : '上午';
                    const displayHours = hours % 12 || 12;
                    const minutes = now.getMinutes().toString().padStart(2, '0');
                    setCurrentTime(`${ampm} ${displayHours}:${minutes}`);
                };
                updateClock();
                const timer = setInterval(updateClock, 10000);
                return () => clearInterval(timer);
            }, []);

            // 跑馬燈跳動邏輯
            useEffect(() => {
                if (isSpinning) {
                    spinRef.current = setInterval(() => {
                        setSpinIndex(prev => (prev + 1) % CHARACTERS.length);
                    }, 100);
                } else {
                    clearInterval(spinRef.current);
                }
                return () => clearInterval(spinRef.current);
            }, [isSpinning]);

            // 語音辨識初始化
            useEffect(() => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    recognitionRef.current = new SpeechRecognition();
                    recognitionRef.current.lang = 'zh-TW';
                    recognitionRef.current.continuous = false;
                    recognitionRef.current.interimResults = false;

                    recognitionRef.current.onresult = (event) => {
                        const result = event.results[0][0].transcript;
                        setTranscript(result);
                        handleSpeechEnd(result);
                    };
                    recognitionRef.current.onerror = () => setIsListening(false);
                    recognitionRef.current.onend = () => setIsListening(false);
                }
            }, []);

            const handleSpeechEnd = (text) => {
                if (text.length > 0) {
                    const targetIdx = currentLevelIdxRef.current;
                    setFeedback({ type: 'success', message: '說得太好了！挑戰成功！' });
                    
                    setAllProgress(prev => {
                        const charData = prev[selectedCharacter];
                        const newCompleted = charData.completed.includes(targetIdx) 
                            ? charData.completed 
                            : [...charData.completed, targetIdx];
                        
                        return {
                            ...prev,
                            [selectedCharacter]: {
                                completed: newCompleted,
                                records: { ...charData.records, [targetIdx]: text }
                            }
                        };
                    });
                }
            };

            const startListening = () => {
                if (!recognitionRef.current) return;
                setTranscript('');
                setFeedback({ type: '', message: '' });
                setIsListening(true);
                recognitionRef.current.start();
            };

            const toggleSpin = () => {
                if (isSpinning) {
                    setIsSpinning(false);
                    setTimeout(() => {
                        setSelectedCharacter(CHARACTERS[spinIndex]);
                        setGameState('LEVEL_SELECT');
                    }, 1200);
                } else {
                    setIsSpinning(true);
                    if (spinIndex === -1) setSpinIndex(0);
                }
            };

            const goBackToMap = () => {
                setGameState('LEVEL_SELECT');
                setFeedback({ type: '', message: '' });
                setTranscript('');
            };

            // 星星渲染組件
            const StarsDisplay = ({ count }) => {
                return (
                    <div className="flex gap-1 mt-2 flex-wrap justify-center max-w-full px-2">
                        {[...Array(10)].map((_, i) => (
                            <span key={i} className={`text-2xl ${i < count ? 'text-yellow-400 drop-shadow-sm' : 'text-slate-200 opacity-30'}`}>
                                ★
                            </span>
                        ))}
                    </div>
                );
            };

            // 1. 姓名選擇
            const renderCharacterSelect = () => (
                <div className="h-full w-full flex flex-col items-center justify-between py-6 px-12 bg-gradient-to-br from-slate-50 to-indigo-50">
                    <h2 className="text-5xl font-black text-slate-800 tracking-widest mt-4">選擇你的小夥伴</h2>
                    
                    <div className="grid grid-cols-4 gap-6 w-full max-w-6xl">
                        {CHARACTERS.map((name, idx) => {
                            const count = allProgress[name].completed.length;
                            return (
                                <div
                                    key={name}
                                    className={`
                                        bg-white p-5 rounded-[2.5rem] shadow-lg border-[8px] border-white transition-all duration-150 flex flex-col items-center justify-center min-h-[220px]
                                        ${spinIndex === idx ? 'selected-frame border-red-500 bg-red-50' : 'opacity-90'}
                                    `}
                                >
                                    <div className={`w-16 h-16 rounded-full flex items-center justify-center transition-colors ${spinIndex === idx ? 'bg-red-200 text-red-600' : 'bg-indigo-50 text-indigo-400'}`}>
                                        <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                                    </div>
                                    <span className={`text-4xl font-black mt-2 transition-colors ${spinIndex === idx ? 'text-red-600' : 'text-slate-700'}`}>
                                        {name}
                                    </span>
                                    <StarsDisplay count={count} />
                                </div>
                            );
                        })}
                    </div>

                    <button 
                        onClick={toggleSpin}
                        className={`px-24 py-8 rounded-[3.5rem] text-6xl font-black shadow-2xl transition-all active:scale-95 mb-4 ${isSpinning ? 'bg-red-500 text-white animate-pulse' : 'bg-indigo-600 text-white'}`}
                    >
                        {isSpinning ? "停止！" : "開始隨機選人"}
                    </button>
                </div>
            );

            // 2. 關卡選擇
            const renderLevelSelect = () => {
                const charData = allProgress[selectedCharacter];
                return (
                    <div className="h-full w-full flex flex-col items-center p-8 bg-slate-50 overflow-hidden">
                        <div className="flex items-center justify-between w-full max-w-7xl mb-6">
                            <button onClick={() => { setGameState('CHARACTER_SELECT'); setSpinIndex(-1); }} className="text-2xl font-bold text-slate-400 bg-white px-6 py-2 rounded-2xl shadow-sm active:bg-slate-100 transition-colors">
                                ← 重選挑戰者
                            </button>
                            <h2 className="text-4xl font-black text-slate-800 flex items-center gap-4">
                                <span className="text-indigo-600 underline underline-offset-8 decoration-indigo-200">{selectedCharacter}</span> 的冒險地圖
                                <span className="bg-yellow-100 text-yellow-600 px-4 py-1 rounded-full text-2xl flex items-center gap-2">★ {charData.completed.length}</span>
                            </h2>
                            <div className="w-32"></div>
                        </div>
                        
                        <div className="grid grid-cols-5 gap-6 w-full max-w-7xl flex-grow content-center">
                            {SCENARIOS.map((s, idx) => (
                                <button
                                    key={s.id}
                                    onClick={() => {
                                        setCurrentLevelIdx(idx);
                                        setGameState('PLAYING');
                                        setFeedback({ type: '', message: '' });
                                        // 進入時，如果已經有紀錄，先顯示記錄
                                        setTranscript(allProgress[selectedCharacter].records[idx] || '');
                                    }}
                                    className={`
                                        relative h-48 rounded-[3rem] flex flex-col items-center justify-center gap-2 transition-all shadow-lg border-[8px] active:scale-90
                                        ${charData.completed.includes(idx) 
                                            ? 'bg-green-50 border-green-400 text-green-700' 
                                            : 'bg-white border-white hover:border-indigo-300 text-slate-600'}
                                    `}
                                >
                                    <span className="text-6xl">{s.emoji}</span>
                                    <span className="font-black text-2xl tracking-tighter">第 {idx + 1} 關</span>
                                    {charData.completed.includes(idx) && (
                                        <div className="absolute top-3 right-3 text-green-500">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                        </div>
                                    )}
                                </button>
                            ))}
                        </div>
                    </div>
                );
            };

            // 3. 遊玩頁面
            const renderPlaying = () => {
                const s = SCENARIOS[currentLevelIdx];
                const charData = allProgress[selectedCharacter];
                const isAlreadyCompleted = charData.completed.includes(currentLevelIdx);
                const isSuccessNow = feedback.type === 'success';
                const displayedTranscript = transcript || charData.records[currentLevelIdx] || '';

                return (
                    <div className="h-full w-full flex flex-col items-center justify-center p-4 bg-indigo-50 overflow-hidden">
                        <div className="w-full max-w-[95vw] flex justify-start mb-2">
                            <button 
                                onClick={goBackToMap}
                                className="text-xl font-bold text-indigo-600 bg-white px-6 py-2 rounded-2xl shadow-md active:bg-indigo-100"
                            >
                                ← 返回地圖
                            </button>
                        </div>

                        <div className="bg-white rounded-[4rem] shadow-2xl overflow-hidden w-full max-w-[95vw] flex flex-1 max-h-[80vh] border-b-[16px] border-indigo-200">
                            <div className="w-[38%] bg-indigo-600 flex flex-col items-center justify-center p-8 text-center text-white relative">
                                <div className="text-[14rem] mb-6 drop-shadow-2xl leading-none">{s.emoji}</div>
                                <div className="bg-white/20 px-8 py-3 rounded-full text-2xl font-black tracking-widest uppercase">LEVEL {currentLevelIdx + 1}</div>
                                <div className="absolute top-0 left-0 w-full h-full opacity-10 bg-[radial-gradient(circle,white_1px,transparent_1px)] bg-[size:40px_40px]"></div>
                            </div>

                            <div className="w-[62%] p-10 flex flex-col justify-between items-center overflow-hidden">
                                <div className="bg-slate-50 rounded-[3rem] p-8 border-2 border-slate-100 w-full text-center shadow-inner flex flex-col justify-center">
                                    <p className="text-indigo-500 text-xl mb-2 font-black">{selectedCharacter} 遇到了：</p>
                                    <h3 className="text-4xl font-black text-gray-700 leading-tight">「{s.text}」</h3>
                                </div>

                                <div className="flex flex-col items-center gap-4 w-full">
                                    {!(isAlreadyCompleted || isSuccessNow) && <p className="text-indigo-600 font-black text-3xl text-center">{s.hint}</p>}

                                    <div className="flex items-center gap-8 bg-indigo-50/50 p-6 rounded-[3.5rem] border-2 border-indigo-100 w-full justify-center shadow-sm">
                                        {(isAlreadyCompleted || isSuccessNow) ? (
                                            <button 
                                                onClick={goBackToMap}
                                                className="bg-green-500 hover:bg-green-600 text-white font-black py-10 px-16 rounded-[3rem] text-4xl shadow-xl active:scale-95 transition-all flex items-center gap-4"
                                            >
                                                <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round"><polyline points="9 10 4 15 9 20"></polyline><path d="M20 20V9a4 4 0 0 0-4-4H4"></path></svg>
                                                挑戰完成！回到地圖
                                            </button>
                                        ) : (
                                            <>
                                                <button 
                                                    onClick={startListening}
                                                    disabled={isListening}
                                                    className={`
                                                        relative w-36 h-36 rounded-full flex items-center justify-center transition-all duration-300
                                                        ${isListening ? 'bg-red-500 scale-110 shadow-[0_0_60px_rgba(239,68,68,0.7)]' : 'bg-indigo-600 hover:bg-indigo-700 active:scale-90 shadow-xl'}
                                                    `}
                                                >
                                                    {isListening && <div className="absolute inset-0 rounded-full animate-ping bg-red-400 opacity-75 scale-125"></div>}
                                                    <div className="text-white relative z-10 scale-[1.6]">
                                                         <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
                                                    </div>
                                                </button>
                                                <div className="text-left">
                                                    <p className={`text-4xl font-black ${isListening ? 'text-red-500 animate-pulse' : 'text-slate-400'}`}>
                                                        {isListening ? "正在聽你說..." : "點擊麥克風說話"}
                                                    </p>
                                                </div>
                                            </>
                                        )}
                                    </div>
                                </div>

                                <div className="h-[150px] w-full flex flex-col items-center justify-center text-center">
                                    {displayedTranscript && (
                                        <div className="bg-white px-8 py-5 rounded-[2.5rem] mb-2 border-4 border-indigo-100 shadow-md max-w-full">
                                            <p className="text-indigo-400 text-lg font-bold mb-1 tracking-wider">
                                                {isAlreadyCompleted && !isSuccessNow ? "回顧記錄內容：" : "剛才說的話："}
                                            </p>
                                            <p className="text-4xl font-black text-indigo-800 px-4">「{displayedTranscript}」</p>
                                        </div>
                                    )}
                                    {isSuccessNow && (
                                        <div className="px-10 py-6 rounded-[3.5rem] font-black text-4xl animate-bounce shadow-xl bg-green-500 text-white flex items-center gap-4">
                                            <span className="text-5xl">✔</span>
                                            說得太好了！挑戰成功！
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            const renderResult = () => (
                <div className="h-full w-full flex flex-col items-center justify-center p-8 bg-yellow-50 overflow-hidden">
                    <div className="bg-white rounded-[5rem] shadow-2xl p-16 max-w-4xl w-full text-center border-t-[24px] border-yellow-400">
                        <div className="text-[14rem] mb-6 animate-bounce leading-none">🏆</div>
                        <h2 className="text-7xl font-black text-gray-800 mb-8 tracking-tighter">太厲害了！</h2>
                        <p className="text-4xl text-gray-400 mb-12 font-bold leading-tight">
                            恭喜 <span className="text-indigo-600 underline underline-offset-[12px] decoration-indigo-100">{selectedCharacter}</span>！<br/>你順利完成了所有冒險。
                        </p>
                        <button 
                            onClick={() => { 
                                const reset = {};
                                CHARACTERS.forEach(c => reset[c] = { completed: [], records: {} });
                                setAllProgress(reset);
                                setGameState('CHARACTER_SELECT'); 
                                setSpinIndex(-1); 
                            }}
                            className="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-black py-8 rounded-[3rem] flex items-center justify-center gap-6 text-4xl shadow-2xl active:scale-95 transition-all"
                        >
                            <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round"><path d="M23 4v6h-6"></path><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
                            重新開始挑戰
                        </button>
                    </div>
                </div>
            );

            return (
                <div className="h-full w-full flex flex-col relative overflow-hidden">
                    {(gameState === 'PLAYING' || gameState === 'LEVEL_SELECT') && (
                        <div className="w-full h-6 bg-white overflow-hidden shadow-sm">
                            <div 
                                className="h-full bg-gradient-to-r from-indigo-400 via-purple-500 to-indigo-600 transition-all duration-1000 ease-out"
                                style={{ width: `${(allProgress[selectedCharacter]?.completed.length / SCENARIOS.length) * 100}%` }}
                            />
                        </div>
                    )}

                    <div className="flex-grow overflow-hidden relative">
                        {gameState === 'CHARACTER_SELECT' && renderCharacterSelect()}
                        {gameState === 'LEVEL_SELECT' && renderLevelSelect()}
                        {gameState === 'PLAYING' && renderPlaying()}
                        {gameState === 'RESULT' && renderResult()}
                    </div>

                    <div className="h-16 bg-white flex items-center justify-between px-16 border-t border-slate-100 z-50">
                         <div className="bg-indigo-600 text-white px-5 py-1.5 rounded-xl font-black text-3xl tabular-nums shadow-lg">
                            {currentTime}
                         </div>
                         <span className="text-slate-200 font-black tracking-[1.5em] text-lg uppercase hidden lg:inline">Emotion Adventure • Social Game</span>
                         <div className="bg-slate-100 px-5 py-1.5 rounded-xl font-black text-slate-400 text-xl shadow-inner">
                             當前人物過關數：{allProgress[selectedCharacter]?.completed.length || 0} / 10
                         </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
