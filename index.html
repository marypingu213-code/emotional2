<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>情緒大冒險 - 互動點名與永久紀錄</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React, ReactDOM, Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDK (Compat Version is more stable for single file without bundlers) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        body, html { 
            margin: 0; padding: 0; height: 100vh; width: 100vw; 
            overflow: hidden; 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #F8FAFC;
            user-select: none;
            touch-action: none;
        }
        #root { height: 100%; width: 100%; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes star-pop {
            0% { transform: scale(0); }
            80% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        .star-animate { animation: star-pop 0.5s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 1. Firebase 設定 ---
        const firebaseConfig = {
            apiKey: "AIzaSyBdioCJeP0FbZvX_opzhrgsgQ5OtQR5J_Y",
            authDomain: "emotionadventure-bca46.firebaseapp.com",
            projectId: "emotionadventure-bca46",
            storageBucket: "emotionadventure-bca46.firebasestorage.app",
            messagingSenderId: "255312343191",
            appId: "1:255312343191:web:ac90f2cbb36296edbdf9d2",
            measurementId: "G-D7WVZ0SQBL"
        };

        // Initialize Firebase
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();
        const auth = firebase.auth();
        const appId = "emotion_adventure_v10";

        const CHARACTER_DATA = [
            { name: "沄恩", img: "spic/1.jpg" },
            { name: "澄洋", img: "spic/2.jpg" },
            { name: "意欣", img: "spic/3.jpg" },
            { name: "宇晴", img: "spic/4.jpg" },
            { name: "齊安", img: "spic/5.jpg" },
            { name: "欽銓", img: "spic/6.jpg" },
            { name: "盧楷", img: "spic/7.jpg" }
        ];

        const CHARACTERS = CHARACTER_DATA.map(c => c.name);

        const SCENARIOS = [
            { id: 1, text: "我和同學玩遊戲輸了，我覺得心裡酸酸的。", emoji: "🎮", hint: "輸掉遊戲時，你會怎麼跟自己說？" },
            { id: 2, text: "今天早上我上課遲到了，進教室時看到大家都在看我。", emoji: "⏰", hint: "遲到的時候，你想跟老師說什麼？" },
            { id: 3, text: "上課要寫字時，我發現我忘了帶鉛筆盒。", emoji: "✏️", hint: "沒帶工具時，該怎麼辦呢？" },
            { id: 4, text: "老師叫我上台發表，但我好害羞，不敢看大家。", emoji: "🫣", hint: "心裡很緊張的時候，可以做什麼動作？" },
            { id: 5, text: "下課排隊玩溜滑梯，前面的同學動作好慢喔。", emoji: "⏳", hint: "等待時，心裡可以想些什麼？" },
            { id: 6, text: "同學不小心撞到我，他趕快跟我說對不起。", emoji: "🕊️", hint: "對方道歉了，你會怎麼回應他？" },
            { id: 7, text: "教室裡面突然好吵好大聲，我覺得耳朵痛痛的。", emoji: "🙉", hint: "覺得不舒服時，你會怎麼尋求幫忙？" },
            { id: 8, text: "我畫了一張好漂亮的畫，老師把它貼在公佈欄給大家看。", emoji: "🖼️", hint: "被稱讚的時候，你現在的心情是..." },
            { id: 9, text: "午餐的湯不小心灑在衣服上了，濕濕黏黏的。", emoji: "🥣", hint: "衣服髒了很不舒服，該怎麼解決呢？" },
            { id: 10, text: "同學跟我借彩色筆，我也借給他一起用。", emoji: "🖍️", hint: "分享東西給別人，你覺得現在的心情是..." }
        ];

        function App() {
            const [user, setUser] = useState(null);
            const [gameState, setGameState] = useState('CHARACTER_SELECT'); 
            const [selectedCharacter, setSelectedCharacter] = useState(null);
            const [currentLevelIdx, setCurrentLevelIdx] = useState(0);
            const [isListening, setIsListening] = useState(false);
            const [transcript, setTranscript] = useState('');
            const [allProgress, setAllProgress] = useState({});
            const [currentTime, setCurrentTime] = useState('');

            const recognitionRef = useRef(null);

            // 1. 初始化 Firebase (Rule 3: Auth First)
            useEffect(() => {
                const init = async () => {
                    await auth.signInAnonymously();
                };
                init();
                const unsub = auth.onAuthStateChanged(u => setUser(u));
                return () => unsub();
            }, []);

            // 2. 監聽數據 (Rule 1: Strict Paths)
            useEffect(() => {
                if (!user) return;
                // Follow Rule 1: /artifacts/{appId}/public/data/{collectionName}
                const docRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('progress').doc('summary');
                
                return docRef.onSnapshot((snap) => {
                    if (snap.exists) {
                        setAllProgress(snap.data().students || {});
                    } else {
                        const init = {};
                        CHARACTERS.forEach(c => init[c] = { completed: [], records: {} });
                        setAllProgress(init);
                    }
                }, (err) => console.error("Firestore Listen error", err));
            }, [user]);

            // 3. 其他初始化
            useEffect(() => {
                const tick = () => {
                    const now = new Date();
                    setCurrentTime(`${now.getHours() >= 12 ? '下午' : '上午'} ${now.getHours() % 12 || 12}:${now.getMinutes().toString().padStart(2, '0')}`);
                };
                tick();
                const timer = setInterval(tick, 10000);

                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SR) {
                    recognitionRef.current = new SR();
                    recognitionRef.current.lang = 'zh-TW';
                    recognitionRef.current.onresult = (e) => setTranscript(e.results[0][0].transcript);
                    recognitionRef.current.onerror = () => setIsListening(false);
                    recognitionRef.current.onend = () => setIsListening(false);
                }
                return () => clearInterval(timer);
            }, []);

            // --- 核心功能：雲端存檔 ---
            const saveToCloud = async (textToSave) => {
                if (!user || !selectedCharacter) return;
                
                const charData = allProgress[selectedCharacter] || { completed: [], records: {} };
                const newCompleted = [...new Set([...(charData.completed || []), currentLevelIdx])];
                const updatedRecords = { ...(charData.records || {}), [currentLevelIdx]: textToSave };
                
                const newData = {
                    ...allProgress,
                    [selectedCharacter]: {
                        completed: newCompleted,
                        records: updatedRecords
                    }
                };

                try {
                    const docRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('progress').doc('summary');
                    await docRef.set({ students: newData }, { merge: true });
                    setGameState('LEVEL_SELECT');
                } catch (e) {
                    console.error("Save error", e);
                }
            };

            const handleDeleteRecord = async (charName, levelIdxToDelete) => {
                if (!user) return;
                const charData = allProgress[charName] || { completed: [], records: {} };
                
                // 移除該關卡的完成狀態與文字紀錄
                const newCompleted = charData.completed.filter(idx => idx !== levelIdxToDelete);
                const newRecords = { ...charData.records };
                delete newRecords[levelIdxToDelete];

                const newData = {
                    ...allProgress,
                    [charName]: {
                        completed: newCompleted,
                        records: newRecords
                    }
                };

                // 立即更新本地畫面
                setAllProgress(newData);

                try {
                    // 寫入雲端 (注意：此處故意不使用 merge，以確保刪除的欄位被確實從資料庫抹除)
                    const docRef = db.collection('artifacts').doc(appId).collection('public').doc('data').collection('progress').doc('summary');
                    await docRef.set({ students: newData });
                    
                    // 如果正在遊戲畫面中刪除，順便將目前的輸入框清空
                    if (gameState === 'PLAYING' && charName === selectedCharacter && levelIdxToDelete === currentLevelIdx) {
                        setTranscript('');
                    }
                } catch (e) {
                    console.error("Delete error", e);
                }
            };

            const startListening = () => {
                if (!recognitionRef.current || isListening) return;
                setTranscript('');
                setIsListening(true);
                try { recognitionRef.current.start(); } catch (e) { setIsListening(false); }
            };

            const CharacterAvatar = ({ name, className = "w-28 h-28" }) => {
                const char = CHARACTER_DATA.find(c => c.name === name);
                const [err, setErr] = useState(false);
                return (
                    <div className={`${className} rounded-full overflow-hidden border-4 border-white shadow-inner bg-indigo-50 flex items-center justify-center`}>
                        {!err && char?.img ? <img src={char.img} className="w-full h-full object-cover" onError={() => setErr(true)} /> : <span className="text-3xl text-indigo-200 font-bold">{name[0]}</span>}
                    </div>
                );
            };

            const StarsDisplay = ({ count }) => (
                <div className="flex flex-wrap justify-center gap-1 mt-2">
                    {[...Array(10)].map((_, i) => (
                        <span key={i} className={`text-xl transition-all ${i < count ? 'text-yellow-400 star-animate' : 'text-slate-200'}`}>★</span>
                    ))}
                </div>
            );

            return (
                <div className="h-full w-full flex flex-col relative overflow-hidden">
                    {/* 進度條 */}
                    {(gameState === 'PLAYING' || gameState === 'LEVEL_SELECT') && (
                        <div className="w-full h-8 bg-white shadow-sm overflow-hidden">
                            <div className="h-full bg-gradient-to-r from-indigo-400 to-indigo-600 transition-all duration-1000" style={{ width: `${((allProgress[selectedCharacter]?.completed?.length || 0) / 10) * 100}%` }} />
                        </div>
                    )}

                    <div className="flex-grow overflow-hidden relative">
                        {/* 1. 首頁 */}
                        {gameState === 'CHARACTER_SELECT' && (
                            <div className="h-full flex flex-col items-center justify-between py-10 px-12 bg-gradient-to-br from-indigo-50 to-white">
                                <div className="text-center"><h2 className="text-5xl font-black text-slate-800 tracking-widest mt-4">誰要來接受挑戰？</h2><p className="text-slate-400 font-bold mt-2 italic">點擊相片即可進入「冒險地圖」</p></div>
                                <div className="grid grid-cols-4 gap-6 w-full max-w-6xl">
                                    {CHARACTER_DATA.map((char) => (
                                        <div key={char.name} className="bg-white p-6 rounded-[3.5rem] shadow-lg border-[8px] border-white hover:border-indigo-100 transition-all flex flex-col items-center justify-center min-h-[230px] cursor-pointer active:scale-95" 
                                             onClick={() => { setSelectedCharacter(char.name); setGameState('LEVEL_SELECT'); }}>
                                            <CharacterAvatar name={char.name} />
                                            <span className="text-4xl font-black text-slate-700 mt-2">{char.name}</span>
                                            <StarsDisplay count={allProgress[char.name]?.completed?.length || 0} />
                                        </div>
                                    ))}
                                </div>
                                <div className="w-full flex justify-center pb-6">
                                    <button onClick={() => { setSelectedCharacter(null); setGameState('SUMMARY'); }} className="bg-white border-2 border-slate-200 text-slate-400 px-16 py-6 rounded-[3rem] font-black text-3xl active:scale-95 shadow-xl">📊 紀錄總覽回顧</button>
                                </div>
                            </div>
                        )}

                        {/* 2. 紀錄看板 */}
                        {gameState === 'SUMMARY' && (
                            <div className="h-full bg-slate-50 p-8 overflow-hidden flex flex-col">
                                <div className="flex items-center justify-between mb-8 px-4"><button onClick={() => setGameState('CHARACTER_SELECT')} className="text-3xl font-black text-indigo-600 bg-white px-10 py-5 rounded-[2.5rem] shadow-md active:scale-95">← 返回首頁</button><h2 className="text-5xl font-black text-slate-800">全班冒險紀錄總表</h2><div className="w-40" /></div>
                                <div className="flex-grow overflow-y-auto no-scrollbar pb-24 px-4">
                                    <div className="grid gap-8 max-w-5xl mx-auto">
                                        {(selectedCharacter ? [selectedCharacter] : CHARACTERS).map(name => (
                                            <div key={name} className="bg-white rounded-[4rem] p-10 shadow-xl border-2 border-indigo-50">
                                                <div className="flex items-center justify-between border-b-4 border-slate-50 pb-6 mb-6">
                                                    <div className="flex items-center gap-6"><CharacterAvatar name={name} className="w-24 h-24" /><span className="text-5xl font-black text-slate-800">{name}</span></div>
                                                    <span className="text-yellow-500 font-black text-4xl italic">★ {allProgress[name]?.completed?.length || 0}</span>
                                                </div>
                                                <div className="grid gap-6">
                                                    {allProgress[name]?.completed?.length > 0 ? allProgress[name].completed.sort((a,b)=>a-b).map(idx => (
                                                        <div key={idx} className="bg-indigo-50/50 p-8 rounded-[3rem] flex flex-col gap-4">
                                                            <div className="flex items-center justify-between">
                                                                <div className="flex items-center gap-4 text-3xl font-black text-indigo-600"><span>{SCENARIOS[idx].emoji}</span> 第 {idx + 1} 關</div>
                                                                <button 
                                                                    onClick={() => handleDeleteRecord(name, idx)}
                                                                    className="bg-red-100 hover:bg-red-500 text-red-500 hover:text-white px-6 py-2 rounded-2xl font-bold text-xl transition-colors shadow-sm flex items-center gap-2"
                                                                >
                                                                    🗑️ 刪除紀錄
                                                                </button>
                                                            </div>
                                                            <p className="text-4xl font-black text-slate-700 bg-white p-6 rounded-[2rem] shadow-sm leading-relaxed">「{allProgress[name].records[idx]}」</p>
                                                        </div>
                                                    )) : <p className="text-center text-slate-300 py-10 text-3xl font-bold italic">目前尚未有存檔紀錄</p>}
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* 3. 選關地圖 */}
                        {gameState === 'LEVEL_SELECT' && (
                            <div className="h-full flex flex-col items-center p-8 bg-slate-50 overflow-hidden">
                                <div className="flex items-center justify-between w-full max-w-7xl mb-8 px-4">
                                    <button onClick={() => setGameState('CHARACTER_SELECT')} className="text-3xl font-black text-slate-400 px-8 py-4 active:scale-95">← 重選挑戰者</button>
                                    <h2 className="text-5xl font-black text-slate-800 flex items-center gap-6"><CharacterAvatar name={selectedCharacter} className="w-24 h-24" /><span className="text-indigo-600 underline underline-offset-8 decoration-indigo-200">{selectedCharacter}</span> 的冒險地圖</h2>
                                    <button onClick={() => setGameState('SUMMARY')} className="bg-indigo-50 text-indigo-600 px-10 py-5 rounded-[2rem] font-black text-2xl shadow-sm active:scale-95">📜 歷史回顧</button>
                                </div>
                                <div className="grid grid-cols-5 gap-8 w-full max-w-7xl flex-grow content-center">
                                    {SCENARIOS.map((s, idx) => (
                                        <button key={s.id} onClick={() => { setCurrentLevelIdx(idx); setGameState('PLAYING'); setTranscript(allProgress[selectedCharacter]?.records?.[idx] || ''); }} 
                                            className={`relative h-60 rounded-[4.5rem] flex flex-col items-center justify-center gap-3 transition-all shadow-xl border-[10px] active:scale-90 ${allProgress[selectedCharacter]?.completed?.includes(idx) ? 'bg-green-50 border-green-400 text-green-700' : 'bg-white border-white hover:border-indigo-200'}`}>
                                            <span className="text-8xl">{s.emoji}</span><span className="font-black text-3xl">第 {idx+1} 關</span>
                                            {allProgress[selectedCharacter]?.completed?.includes(idx) && <div className="absolute top-4 right-4 text-green-500"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 4. 遊玩面 */}
                        {gameState === 'PLAYING' && (
                            <div className="h-full flex flex-col items-center justify-center p-6 bg-indigo-50 overflow-hidden">
                                <div className="w-full max-w-[95vw] flex justify-between items-center mb-2 px-6">
                                    <button onClick={() => setGameState('LEVEL_SELECT')} className="text-2xl font-bold text-indigo-600 bg-white px-10 py-4 rounded-3xl shadow-md active:bg-slate-50">← 返回地圖</button>
                                    <div className="flex items-center gap-4 bg-white/80 px-8 py-3 rounded-full border border-white shadow-sm"><CharacterAvatar name={selectedCharacter} className="w-14 h-14" /><span className="font-black text-3xl text-slate-700">{selectedCharacter}</span></div>
                                </div>

                                <div className="bg-white rounded-[5rem] shadow-2xl overflow-hidden w-full max-w-[95vw] flex flex-1 max-h-[75vh] border-b-[24px] border-indigo-200">
                                    <div className="w-[35%] bg-indigo-600 flex flex-col items-center justify-center p-8 text-center text-white relative">
                                        <div className="text-[18rem] mb-8 drop-shadow-2xl">{SCENARIOS[currentLevelIdx].emoji}</div>
                                        <div className="bg-white/20 px-10 py-4 rounded-full text-4xl font-black uppercase tracking-widest uppercase">LEVEL {currentLevelIdx + 1}</div>
                                    </div>
                                    <div className="w-[65%] p-10 flex flex-col justify-between items-center overflow-hidden">
                                        <div className="bg-slate-50 rounded-[4rem] p-10 border-4 border-slate-100 w-full text-center shadow-inner flex flex-col justify-center min-h-[180px]">
                                            <h3 className="text-5xl font-black text-gray-700 leading-tight">「{SCENARIOS[currentLevelIdx].text}」</h3>
                                        </div>
                                        <div className="flex flex-col items-center gap-6 w-full">
                                            <p className="text-indigo-600 font-black text-4xl text-center">{SCENARIOS[currentLevelIdx].hint}</p>
                                            <div className="flex items-center gap-10 bg-indigo-50/50 p-8 rounded-[4rem] border-2 border-indigo-100 w-full justify-center shadow-sm">
                                                <button onClick={startListening} disabled={isListening} className={`relative w-44 h-44 rounded-full flex items-center justify-center transition-all duration-300 ${isListening ? 'bg-red-500 scale-110 shadow-[0_0_60px_rgba(239,68,68,0.7)]' : 'bg-indigo-600 hover:bg-indigo-700 shadow-xl active:scale-90'}`}>
                                                    {isListening && <div className="absolute inset-0 rounded-full animate-ping bg-red-400 opacity-75 scale-125"></div>}
                                                    <div className="text-white relative z-10 scale-[2.2]"><svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg></div>
                                                </button>
                                                <div className="text-left">
                                                    <p className={`text-6xl font-black ${isListening ? 'text-red-500 animate-pulse' : 'text-slate-400'}`}>{isListening ? "正在傾聽..." : "點擊錄音"}</p>
                                                    <p className="text-2xl text-slate-300 mt-2 font-bold decoration-indigo-100 italic">點擊下方可修正文字內容</p>
                                                </div>
                                            </div>
                                        </div>
                                        <div className="h-[220px] w-full flex flex-col items-center justify-center text-center gap-4">
                                            <div className="bg-white w-full px-10 py-6 rounded-[3.5rem] border-[10px] border-indigo-200 shadow-2xl flex flex-col gap-2 relative">
                                                <div className="flex items-center justify-between border-b-2 border-slate-50 pb-2 mb-2">
                                                    <p className="text-indigo-400 text-2xl font-black flex items-center gap-2">💬 學生的敘述：</p>
                                                    {allProgress[selectedCharacter]?.completed?.includes(currentLevelIdx) && (
                                                        <button 
                                                            onClick={() => handleDeleteRecord(selectedCharacter, currentLevelIdx)}
                                                            className="bg-red-100 hover:bg-red-500 text-red-500 hover:text-white px-5 py-2 rounded-xl font-bold text-lg transition-colors shadow-sm flex items-center gap-2"
                                                        >
                                                            🗑️ 刪除重答
                                                        </button>
                                                    )}
                                                </div>
                                                <textarea className="w-full text-5xl font-black text-indigo-900 text-center bg-transparent border-none focus:ring-0 resize-none h-32 no-scrollbar leading-relaxed" 
                                                          value={transcript} onChange={(e) => setTranscript(e.target.value)} placeholder="等待輸入中..." />
                                            </div>
                                            {transcript.length > 0 && !isListening && (
                                                <button onClick={() => saveToCloud(transcript)} className="bg-green-500 hover:bg-green-600 text-white font-black py-8 px-20 rounded-[3rem] text-5xl shadow-xl active:scale-95 transition-all flex items-center gap-6 shadow-[0_10px_40px_rgba(34,197,94,0.4)]">
                                                    確認並存入雲端
                                                </button>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    <div className="h-20 bg-white flex items-center justify-between px-20 border-t-2 border-slate-100 z-50 shadow-inner">
                         <div className="bg-indigo-600 text-white px-10 py-3 rounded-2xl font-black text-4xl tabular-nums shadow-lg">{currentTime}</div>
                         <span className="text-slate-200 font-black tracking-[1.2em] text-xl uppercase hidden lg:inline tracking-tighter">Emotion Adventure • Cloud Data Persistence</span>
                         <div className="bg-indigo-50 px-10 py-3 rounded-2xl font-black text-indigo-400 text-3xl shadow-inner">
                             {selectedCharacter ? `${selectedCharacter} 過關：${allProgress[selectedCharacter]?.completed?.length || 0}/10` : "準備開始挑戰"}
                         </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
