<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>情緒大冒險 - 互動點名與永久紀錄</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React, ReactDOM, Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Firebase SDK (Compat Version for simplicity in single file) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        body, html { 
            margin: 0; padding: 0; height: 100vh; width: 100vw; 
            overflow: hidden; 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #F8FAFC;
            user-select: none;
            -webkit-touch-callout: none;
        }
        #root { height: 100%; width: 100%; }
        
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @keyframes star-pop {
            0% { transform: scale(0); }
            80% { transform: scale(1.3); }
            100% { transform: scale(1); }
        }
        .star-animate { animation: star-pop 0.5s ease-out forwards; }

        /* 轉盤旋轉動畫 */
        .wheel-container {
            transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 配置與基礎資料 ---
        const CHARACTER_DATA = [
            { name: "沄恩", img: "spic/1.jpg" },
            { name: "澄洋", img: "spic/2.jpg" },
            { name: "意欣", img: "spic/3.jpg" },
            { name: "宇晴", img: "spic/4.jpg" },
            { name: "齊安", img: "spic/5.jpg" },
            { name: "欽銓", img: "spic/6.jpg" },
            { name: "盧楷", img: "spic/7.jpg" }
        ];

        const CHARACTERS = CHARACTER_DATA.map(c => c.name);

        const SCENARIOS = [
            { id: 1, text: "我和同學玩遊戲輸了，我覺得心裡酸酸的。", emoji: "🎮", hint: "輸掉遊戲時，你會怎麼跟自己說？" },
            { id: 2, text: "今天早上我上課遲到了，進教室時看到大家都在看我。", emoji: "⏰", hint: "遲到的時候，你想跟老師說什麼？" },
            { id: 3, text: "上課要寫字時，我發現我忘了帶鉛筆盒。", emoji: "✏️", hint: "沒帶工具時，該怎麼辦呢？" },
            { id: 4, text: "老師叫我上台發表，但我好害羞，不敢看大家。", emoji: "🫣", hint: "心裡很緊張的時候，可以做什麼動作？" },
            { id: 5, text: "下課排隊玩溜滑梯，前面的同學動作好慢喔。", emoji: "⏳", hint: "等待的時候，心裡可以想些什麼？" },
            { id: 6, text: "同學不小心撞到我，他趕快跟我說對不起。", emoji: "🕊️", hint: "對方道歉了，你會怎麼回應他？" },
            { id: 7, text: "教室裡面突然好吵好大聲，我覺得耳朵痛痛的。", emoji: "🙉", hint: "覺得不舒服時，你會怎麼尋求幫忙？" },
            { id: 8, text: "我畫了一張好漂亮的畫，老師把它貼在公佈欄給大家看。", emoji: "🖼️", hint: "被稱讚的時候，你現在的心情是..." },
            { id: 9, text: "午餐的湯不小心灑在衣服上了，濕濕黏黏的。", emoji: "🥣", hint: "衣服髒了很不舒服，該怎麼解決呢？" },
            { id: 10, text: "同學跟我借彩色筆，我也借給他一起用。", emoji: "🖍️", hint: "分享東西給別人，你覺得現在的心情是..." }
        ];

        // --- Firebase 安全初始化 ---
        let db, auth, appId;
        try {
            const firebaseConfig = JSON.parse(__firebase_config);
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
            db = firebase.firestore();
            auth = firebase.auth();
            appId = typeof __app_id !== 'undefined' ? __app_id : 'emotion-adventure-default';
        } catch (e) {
            console.error("Firebase Init Error", e);
        }

        function App() {
            const [user, setUser] = useState(null);
            const [gameState, setGameState] = useState('CHARACTER_SELECT'); // CHARACTER_SELECT, LEVEL_SELECT, PLAYING, SUMMARY
            const [selectedCharacter, setSelectedCharacter] = useState(null);
            const [currentLevelIdx, setCurrentLevelIdx] = useState(0);
            const [isListening, setIsListening] = useState(false);
            const [transcript, setTranscript] = useState('');
            const [feedback, setFeedback] = useState({ type: '', message: '' });
            const [currentTime, setCurrentTime] = useState('');
            const [allProgress, setAllProgress] = useState({});

            // 轉盤狀態
            const [showWheel, setShowWheel] = useState(false);
            const [wheelRotation, setWheelRotation] = useState(0);
            const [isSpinning, setIsSpinning] = useState(false);

            const recognitionRef = useRef(null);

            // 1. 初始化 Auth 與 資料監聽
            useEffect(() => {
                const init = async () => {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                        await auth.signInWithCustomToken(__initial_auth_token);
                    } else {
                        await auth.signInAnonymously();
                    }
                };
                init();
                const unsubscribeAuth = auth.onAuthStateChanged(u => setUser(u));

                return () => unsubscribeAuth();
            }, []);

            useEffect(() => {
                if (!user) return;
                // 讀取全班進度
                const docRef = db.collection('artifacts').doc(appId).collection('public').doc('data');
                const unsubscribeData = docRef.onSnapshot(doc => {
                    if (doc.exists) {
                        setAllProgress(doc.data().students || {});
                    } else {
                        const init = {};
                        CHARACTERS.forEach(c => init[c] = { completed: [], records: {} });
                        setAllProgress(init);
                    }
                }, err => console.error("Firestore Listen Error", err));

                return () => unsubscribeData();
            }, [user]);

            // 2. 時鐘
            useEffect(() => {
                const update = () => {
                    const now = new Date();
                    const ampm = now.getHours() >= 12 ? '下午' : '上午';
                    const hrs = now.getHours() % 12 || 12;
                    const mins = now.getMinutes().toString().padStart(2, '0');
                    setCurrentTime(`${ampm} ${hrs}:${mins}`);
                };
                update();
                const timer = setInterval(update, 10000);
                return () => clearInterval(timer);
            }, []);

            // 3. 語音辨識
            useEffect(() => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SpeechRecognition) {
                    recognitionRef.current = new SpeechRecognition();
                    recognitionRef.current.lang = 'zh-TW';
                    recognitionRef.current.continuous = false;
                    recognitionRef.current.onresult = (event) => {
                        const result = event.results[0][0].transcript;
                        setTranscript(result);
                        setFeedback({ type: 'success', message: '辨識完成了！老師可以點擊下方修正文字喔。' });
                    };
                    recognitionRef.current.onerror = () => setIsListening(false);
                    recognitionRef.current.onend = () => setIsListening(false);
                }
            }, []);

            // 儲存進度到雲端
            const saveToCloud = async (textToSave) => {
                if (!selectedCharacter || !user) return;
                const charData = allProgress[selectedCharacter] || { completed: [], records: {} };
                const newCompleted = charData.completed.includes(currentLevelIdx) 
                    ? charData.completed 
                    : [...charData.completed, currentLevelIdx];
                
                const updatedRecords = { ...charData.records, [currentLevelIdx]: textToSave };
                
                const newData = {
                    ...allProgress,
                    [selectedCharacter]: { completed: newCompleted, records: updatedRecords }
                };

                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').set({
                        students: newData
                    }, { merge: true });
                    setFeedback({ type: 'success', message: '紀錄已成功儲存到雲端！' });
                } catch (e) {
                    setFeedback({ type: 'error', message: '儲存失敗，請檢查網路。' });
                }
            };

            const startListening = () => {
                if (!recognitionRef.current || isListening) return;
                setTranscript('');
                setFeedback({ type: '', message: '' });
                setIsListening(true);
                try { recognitionRef.current.start(); } catch (e) { setIsListening(false); }
            };

            const spinTheWheel = () => {
                if (isSpinning) return;
                setIsSpinning(true);
                const randomRotate = Math.floor(Math.random() * 360) + 1440; // 轉 4 圈以上
                const newRotation = wheelRotation + randomRotate;
                setWheelRotation(newRotation);

                setTimeout(() => {
                    setIsSpinning(false);
                    const finalDeg = newRotation % 360;
                    const slice = 360 / CHARACTERS.length;
                    // 計算指針停在哪個名字上 (指針在最上方 0度)
                    const index = Math.floor(((360 - (finalDeg % 360)) % 360) / slice);
                    const winner = CHARACTERS[index];
                    
                    setTimeout(() => {
                        setSelectedCharacter(winner);
                        setGameState('LEVEL_SELECT');
                        setShowWheel(false);
                    }, 1000);
                }, 4100);
            };

            // --- 組件渲染 ---

            const CharacterAvatar = ({ name, className = "w-20 h-20" }) => {
                const char = CHARACTER_DATA.find(c => c.name === name);
                const [error, setError] = useState(false);
                return (
                    <div className={`${className} rounded-full overflow-hidden border-4 border-indigo-50 shadow-inner bg-indigo-50 flex items-center justify-center`}>
                        {!error && char?.img ? (
                            <img src={char.img} className="w-full h-full object-cover" onError={() => setError(true)} />
                        ) : (
                            <span className="text-3xl text-indigo-200">👤</span>
                        )}
                    </div>
                );
            };

            const StarsDisplay = ({ count }) => (
                <div className="flex flex-wrap justify-center gap-1 mt-2">
                    {[...Array(10)].map((_, i) => (
                        <span key={i} className={`text-xl transition-all ${i < count ? 'text-yellow-400 star-animate' : 'text-slate-200'}`}>★</span>
                    ))}
                </div>
            );

            // 1. 首頁
            const renderCharacterSelect = () => (
                <div className="h-full w-full flex flex-col items-center justify-between py-6 px-12 bg-gradient-to-br from-indigo-50 to-white">
                    <div className="text-center">
                        <h2 className="text-5xl font-black text-slate-800 tracking-widest mt-4">誰來挑戰情緒冒險？</h2>
                        <p className="text-slate-400 font-bold mt-2">點擊頭像可直接查看該生「回顧紀錄」</p>
                    </div>

                    <div className="grid grid-cols-4 gap-6 w-full max-w-6xl">
                        {CHARACTER_DATA.map((char) => (
                            <div
                                key={char.name}
                                className="bg-white p-6 rounded-[3rem] shadow-lg border-[8px] border-white hover:border-indigo-200 transition-all flex flex-col items-center justify-center min-h-[220px] cursor-pointer active:scale-95"
                                onClick={() => { setSelectedCharacter(char.name); setGameState('SUMMARY'); }}
                            >
                                <CharacterAvatar name={char.name} className="w-24 h-24 mb-2" />
                                <span className="text-4xl font-black text-slate-700">{char.name}</span>
                                <StarsDisplay count={allProgress[char.name]?.completed.length || 0} />
                            </div>
                        ))}
                    </div>

                    <div className="w-full flex justify-between items-end mb-4 px-4">
                        <button 
                            onClick={() => { setSelectedCharacter(null); setGameState('SUMMARY'); }}
                            className="bg-white border-2 border-slate-200 text-slate-400 px-10 py-5 rounded-3xl font-black text-2xl shadow-sm hover:bg-slate-50 transition-all"
                        >
                            📊 全班進度總覽
                        </button>

                        <button 
                            onClick={() => setShowWheel(true)}
                            className="bg-indigo-600 text-white px-14 py-8 rounded-[3.5rem] text-4xl font-black shadow-2xl hover:bg-indigo-700 active:scale-90 flex items-center gap-4 animate-bounce"
                        >
                            🎡 轉盤點名
                        </button>
                    </div>

                    {/* 轉盤彈窗 */}
                    {showWheel && (
                        <div className="fixed inset-0 bg-black/70 z-[100] flex items-center justify-center backdrop-blur-md">
                            <div className="bg-white p-12 rounded-[5rem] flex flex-col items-center gap-10 relative max-w-2xl w-full border-[12px] border-indigo-100 shadow-2xl">
                                <button onClick={() => !isSpinning && setShowWheel(false)} className="absolute top-10 right-10 text-5xl text-slate-200 hover:text-slate-400">✕</button>
                                <h3 className="text-5xl font-black text-slate-800">命運大轉盤</h3>
                                
                                <div className="relative w-96 h-96 flex items-center justify-center">
                                    <div className="absolute top-[-30px] z-50 text-red-600 text-7xl drop-shadow-md">▼</div>
                                    <div 
                                        className="w-full h-full rounded-full border-[12px] border-indigo-600 wheel-container shadow-2xl relative overflow-hidden bg-white"
                                        style={{ transform: `rotate(${wheelRotation}deg)` }}
                                    >
                                        {CHARACTERS.map((name, i) => {
                                            const deg = 360 / CHARACTERS.length;
                                            return (
                                                <div 
                                                    key={name}
                                                    className="absolute w-full h-full flex justify-center pt-6 origin-center"
                                                    style={{ transform: `rotate(${i * deg}deg)` }}
                                                >
                                                    <span className="font-black text-2xl text-indigo-900 drop-shadow-sm">{name}</span>
                                                </div>
                                            );
                                        })}
                                    </div>
                                </div>

                                <button 
                                    onClick={spinTheWheel}
                                    disabled={isSpinning}
                                    className={`px-20 py-8 rounded-[3rem] text-4xl font-black text-white ${isSpinning ? 'bg-slate-300' : 'bg-red-500 shadow-2xl active:scale-95 transition-all'}`}
                                >
                                    {isSpinning ? "轉動中..." : "開始轉動"}
                                </button>
                            </div>
                        </div>
                    )}
                </div>
            );

            // 2. 紀錄總覽
            const renderSummary = () => {
                const names = selectedCharacter ? [selectedCharacter] : CHARACTERS;
                return (
                    <div className="h-full w-full flex flex-col bg-slate-50 p-8 overflow-hidden">
                        <div className="flex items-center justify-between mb-8">
                            <button onClick={() => setGameState('CHARACTER_SELECT')} className="text-3xl font-black text-indigo-600 bg-white px-8 py-4 rounded-3xl shadow-md">← 返回首頁</button>
                            <h2 className="text-5xl font-black text-slate-800 tracking-tighter">
                                {selectedCharacter ? `${selectedCharacter} 的冒險紀錄回顧` : "全班紀錄總覽"}
                            </h2>
                            <div className="w-40"></div>
                        </div>

                        <div className="flex-grow overflow-y-auto no-scrollbar pb-24 px-4">
                            <div className="grid gap-8 w-full max-w-5xl mx-auto">
                                {names.map(name => {
                                    const data = allProgress[name] || { completed: [], records: {} };
                                    return (
                                        <div key={name} className="bg-white rounded-[4rem] p-10 shadow-xl border-2 border-indigo-50">
                                            <div className="flex items-center justify-between border-b-4 border-slate-50 pb-6 mb-6">
                                                <div className="flex items-center gap-6">
                                                    <CharacterAvatar name={name} className="w-20 h-20" />
                                                    <span className="text-5xl font-black text-slate-800">{name}</span>
                                                </div>
                                                <span className="text-yellow-500 font-black text-4xl italic">★ {data.completed.length} 關</span>
                                            </div>
                                            <div className="grid gap-6">
                                                {data.completed.length > 0 ? (
                                                    data.completed.sort((a, b) => a-b).map(idx => (
                                                        <div key={idx} className="bg-indigo-50/50 p-8 rounded-[3rem] border border-indigo-100 flex flex-col gap-4">
                                                            <div className="flex items-center gap-4 text-3xl font-black text-indigo-600">
                                                                <span>{SCENARIOS[idx].emoji}</span> 第 {idx + 1} 關
                                                            </div>
                                                            <p className="text-4xl font-black text-slate-700 bg-white p-6 rounded-[2rem] shadow-sm leading-relaxed">
                                                                「{data.records[idx]}」
                                                            </p>
                                                        </div>
                                                    ))
                                                ) : <p className="text-center text-slate-300 py-10 text-3xl font-bold italic">目前還沒有過關紀錄</p>}
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                );
            };

            // 3. 選關地圖
            const renderLevelSelect = () => {
                const charData = allProgress[selectedCharacter] || { completed: [], records: {} };
                return (
                    <div className="h-full w-full flex flex-col items-center p-8 bg-slate-50 overflow-hidden">
                        <div className="flex items-center justify-between w-full max-w-7xl mb-8">
                            <button onClick={() => setGameState('CHARACTER_SELECT')} className="text-3xl font-black text-slate-400 px-6 py-4">← 重選挑戰者</button>
                            <h2 className="text-5xl font-black text-slate-800 flex items-center gap-6">
                                <CharacterAvatar name={selectedCharacter} className="w-20 h-20" />
                                <span className="text-indigo-600 underline underline-offset-8 decoration-indigo-200">{selectedCharacter}</span> 的冒險地圖
                            </h2>
                            <button onClick={() => setGameState('SUMMARY')} className="bg-indigo-50 text-indigo-600 px-10 py-4 rounded-3xl font-black text-2xl shadow-sm">📜 回顧紀錄</button>
                        </div>
                        
                        <div className="grid grid-cols-5 gap-8 w-full max-w-7xl flex-grow content-center">
                            {SCENARIOS.map((s, idx) => (
                                <button
                                    key={s.id}
                                    onClick={() => { setCurrentLevelIdx(idx); setGameState('PLAYING'); setTranscript(''); setFeedback({type:'', message:''}); }}
                                    className={`
                                        relative h-56 rounded-[4rem] flex flex-col items-center justify-center gap-3 transition-all shadow-xl border-[10px] active:scale-90
                                        ${charData.completed.includes(idx) ? 'bg-green-50 border-green-400 text-green-700' : 'bg-white border-white hover:border-indigo-200 text-slate-600'}
                                    `}
                                >
                                    <span className="text-7xl">{s.emoji}</span>
                                    <span className="font-black text-3xl">第 {idx + 1} 關</span>
                                    {charData.completed.includes(idx) && (
                                        <div className="absolute top-4 right-4 text-green-500">
                                            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                        </div>
                                    )}
                                </button>
                            ))}
                        </div>
                    </div>
                );
            };

            // 4. 遊玩與編輯
            const renderPlaying = () => {
                const s = SCENARIOS[currentLevelIdx];
                const charData = allProgress[selectedCharacter] || { completed: [], records: {} };
                const isAlreadyCompleted = charData.completed.includes(currentLevelIdx);
                const currentText = transcript || charData.records[currentLevelIdx] || '';

                return (
                    <div className="h-full w-full flex flex-col items-center justify-center p-6 bg-indigo-50 overflow-hidden">
                        <div className="w-full max-w-[95vw] flex justify-between items-center mb-2 px-6">
                            <button onClick={() => setGameState('LEVEL_SELECT')} className="text-2xl font-bold text-indigo-600 bg-white px-8 py-3 rounded-2xl shadow-md">← 回到地圖</button>
                            <div className="flex items-center gap-4 bg-white/80 px-6 py-2 rounded-full shadow-sm">
                                <CharacterAvatar name={selectedCharacter} className="w-10 h-10" />
                                <span className="font-black text-2xl text-slate-700">{selectedCharacter}</span>
                            </div>
                        </div>

                        <div className="bg-white rounded-[5rem] shadow-2xl overflow-hidden w-full max-w-[95vw] flex flex-1 max-h-[78vh] border-b-[20px] border-indigo-200">
                            <div className="w-[35%] bg-indigo-600 flex flex-col items-center justify-center p-8 text-center text-white relative">
                                <div className="text-[15rem] mb-8 drop-shadow-2xl">{s.emoji}</div>
                                <div className="bg-white/20 px-10 py-4 rounded-full text-3xl font-black tracking-[0.2em] uppercase">LEVEL {currentLevelIdx + 1}</div>
                                <div className="absolute top-0 left-0 w-full h-full opacity-10 bg-[radial-gradient(circle,white_1px,transparent_1px)] bg-[size:40px_40px]"></div>
                            </div>

                            <div className="w-[65%] p-10 flex flex-col justify-between items-center overflow-hidden">
                                <div className="bg-slate-50 rounded-[4rem] p-10 border-4 border-slate-100 w-full text-center shadow-inner">
                                    <h3 className="text-5xl font-black text-gray-700 leading-snug">「{s.text}」</h3>
                                </div>

                                <div className="flex flex-col items-center gap-4 w-full">
                                    <p className="text-indigo-600 font-black text-3xl text-center">{s.hint}</p>
                                    <div className="flex items-center gap-10 bg-indigo-50/50 p-8 rounded-[4rem] border-2 border-indigo-100 w-full justify-center shadow-sm">
                                        <button 
                                            onClick={startListening} 
                                            disabled={isListening} 
                                            className={`relative w-40 h-40 rounded-full flex items-center justify-center transition-all duration-300 ${isListening ? 'bg-red-500 scale-110 shadow-[0_0_60px_rgba(239,68,68,0.7)]' : 'bg-indigo-600 hover:bg-indigo-700 shadow-xl active:scale-90'}`}
                                        >
                                            {isListening && <div className="absolute inset-0 rounded-full animate-ping bg-red-400 opacity-75 scale-125"></div>}
                                            <div className="text-white relative z-10 scale-[1.8]">
                                                 <svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
                                            </div>
                                        </button>
                                        <div className="text-left">
                                            <p className={`text-5xl font-black ${isListening ? 'text-red-500 animate-pulse' : 'text-slate-400'}`}>
                                                {isListening ? "正在傾聽..." : "點擊開始錄音"}
                                            </p>
                                            <p className="text-xl text-slate-300 mt-2 font-bold uppercase tracking-widest">老師可在下方直接修正文字</p>
                                        </div>
                                    </div>
                                </div>

                                <div className="h-[180px] w-full flex flex-col items-center justify-center text-center gap-4">
                                    {(currentText || isListening) && (
                                        <div className="bg-white w-full px-10 py-6 rounded-[3rem] border-[6px] border-indigo-200 shadow-2xl flex flex-col gap-2">
                                            <p className="text-indigo-400 text-xl font-black tracking-widest border-b-2 border-slate-50 pb-2 mb-2">💬 學生的敘述內容：</p>
                                            <textarea 
                                                className="w-full text-4xl font-black text-indigo-900 text-center bg-transparent border-none focus:ring-0 resize-none h-24 no-scrollbar"
                                                value={currentText}
                                                onChange={(e) => setTranscript(e.target.value)}
                                                placeholder="等待輸入中..."
                                            />
                                        </div>
                                    )}
                                    {currentText.length > 0 && !isListening && (
                                        <button 
                                            onClick={() => saveToCloud(currentText)}
                                            className="bg-green-500 hover:bg-green-600 text-white font-black py-6 px-16 rounded-[2.5rem] text-4xl shadow-xl active:scale-95 transition-all flex items-center gap-6"
                                        >
                                            <svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>
                                            修正完成，確認存檔
                                        </button>
                                    )}
                                </div>
                            </div>
                        </div>
                    </div>
                );
            };

            // --- 主框架 ---
            return (
                <div className="h-full w-full flex flex-col relative overflow-hidden">
                    {(gameState === 'PLAYING' || gameState === 'LEVEL_SELECT') && (
                        <div className="w-full h-8 bg-white shadow-sm overflow-hidden border-b-2 border-slate-50">
                            <div 
                                className="h-full bg-gradient-to-r from-indigo-400 via-purple-500 to-indigo-600 transition-all duration-1000 ease-out"
                                style={{ width: `${((allProgress[selectedCharacter]?.completed.length || 0) / SCENARIOS.length) * 100}%` }}
                            />
                        </div>
                    )}

                    <div className="flex-grow overflow-hidden relative">
                        {gameState === 'CHARACTER_SELECT' && renderCharacterSelect()}
                        {gameState === 'SUMMARY' && renderSummary()}
                        {gameState === 'LEVEL_SELECT' && renderLevelSelect()}
                        {gameState === 'PLAYING' && renderPlaying()}
                    </div>

                    <div className="h-20 bg-white flex items-center justify-between px-20 border-t-2 border-slate-100 z-50 shadow-inner">
                         <div className="bg-indigo-600 text-white px-8 py-2 rounded-2xl font-black text-4xl tabular-nums shadow-lg">
                            {currentTime}
                         </div>
                         <span className="text-slate-200 font-black tracking-[1.2em] text-xl uppercase hidden lg:inline">Emotion Adventure • Cloud Record</span>
                         <div className="bg-indigo-50 px-8 py-2 rounded-2xl font-black text-indigo-400 text-2xl shadow-inner">
                             {selectedCharacter ? `${selectedCharacter} 已完成：${allProgress[selectedCharacter]?.completed.length || 0} / 10` : "請點選轉盤或人物"}
                         </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
