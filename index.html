<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>情緒大冒險 - 互動點名與雙軌紀錄</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        body, html { margin: 0; padding: 0; height: 100vh; width: 100vw; overflow: hidden; font-family: 'Noto Sans TC', sans-serif; background-color: #F8FAFC; user-select: none; touch-action: none; }
        #root { height: 100%; width: 100%; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @keyframes star-pop { 0% { transform: scale(0); } 80% { transform: scale(1.3); } 100% { transform: scale(1); } }
        .star-animate { animation: star-pop 0.5s ease-out forwards; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 1. Firebase 設定 (您提供的控制碼) ---
        const firebaseConfig = {
            apiKey: "AIzaSyBdioCJeP0FbZvX_opzhrgsgQ5OtQR5J_Y",
            authDomain: "emotionadventure-bca46.firebaseapp.com",
            projectId: "emotionadventure-bca46",
            storageBucket: "emotionadventure-bca46.firebasestorage.app",
            messagingSenderId: "255312343191",
            appId: "1:255312343191:web:ac90f2cbb36296edbdf9d2",
            measurementId: "G-D7WVZ0SQBL"
        };

        const CHARACTER_DATA = [
            { name: "沄恩", img: "spic/1.jpg" }, { name: "澄洋", img: "spic/2.jpg" },
            { name: "意欣", img: "spic/3.jpg" }, { name: "宇晴", img: "spic/4.jpg" },
            { name: "齊安", img: "spic/5.jpg" }, { name: "欽銓", img: "spic/6.jpg" },
            { name: "盧楷", img: "spic/7.jpg" }
        ];

        const CHARACTERS = CHARACTER_DATA.map(c => c.name);

        const SCENARIOS = [
            { id: 1, text: "我和同學玩遊戲輸了，我覺得心裡酸酸的。", emoji: "🎮", hint: "輸掉遊戲時，你會怎麼跟自己說？" },
            { id: 2, text: "今天早上我上課遲到了，進教室時看到大家都在看我。", emoji: "⏰", hint: "遲到的時候，你想跟老師說什麼？" },
            { id: 3, text: "上課要寫字時，我發現我忘了帶鉛筆盒。", emoji: "✏️", hint: "沒帶工具時，該怎麼辦呢？" },
            { id: 4, text: "老師叫我上台發表，但我好害羞，不敢看大家。", emoji: "🫣", hint: "心裡很緊張的時候，可以做什麼動作？" },
            { id: 5, text: "下課排隊玩溜滑梯，前面的同學動作好慢喔。", emoji: "⏳", hint: "等待時，心裡可以想些什麼？" },
            { id: 6, text: "同學不小心撞到我，他趕快跟我說對不起。", emoji: "🕊️", hint: "對方道歉了，你會怎麼回應他？" },
            { id: 7, text: "教室裡面突然好吵好大聲，我覺得耳朵痛痛的。", emoji: "🙉", hint: "覺得不舒服時，你會怎麼尋求幫忙？" },
            { id: 8, text: "我畫了一張好漂亮的畫，老師把它貼在公佈欄給大家看。", emoji: "🖼️", hint: "被稱讚的時候，你現在的心情是..." },
            { id: 9, text: "午餐的湯不小心灑在衣服上了，濕濕黏黏的。", emoji: "🥣", hint: "衣服髒了很不舒服，該怎麼解決呢？" },
            { id: 10, text: "同學跟我借彩色筆，我也借給他一起用。", emoji: "🖍️", hint: "分享東西給別人，你覺得現在的心情是..." }
        ];

        // 確保 Firebase 初始化
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const DB_COLLECTION = "ClassRecords_V11";

        function App() {
            const [gameState, setGameState] = useState('CHARACTER_SELECT'); 
            const [selectedCharacter, setSelectedCharacter] = useState(null);
            const [currentLevelIdx, setCurrentLevelIdx] = useState(0);
            const [isListening, setIsListening] = useState(false);
            const [transcript, setTranscript] = useState('');
            const [allProgress, setAllProgress] = useState({});
            const [currentTime, setCurrentTime] = useState('');
            
            const recognitionRef = useRef(null);

            // 1. 初始化資料 (Local Storage + Firebase 雙引擎)
            useEffect(() => {
                auth.signInAnonymously().catch(e => console.warn("Firebase Auth bypassed"));

                // 優先從本地端讀取，確保網頁重整資料絕對在
                const localData = localStorage.getItem('emotion_adventure_data');
                if (localData) {
                    try { setAllProgress(JSON.parse(localData)); } catch(e){}
                } else {
                    const init = {};
                    CHARACTERS.forEach(c => init[c] = { completed: [], records: {} });
                    setAllProgress(init);
                }

                // 嘗試從 Firebase 同步最新資料
                const docRef = db.collection('GameData').doc(DB_COLLECTION);
                const unsub = docRef.onSnapshot(snap => {
                    if (snap.exists) {
                        const remoteData = snap.data().students || {};
                        setAllProgress(remoteData);
                        localStorage.setItem('emotion_adventure_data', JSON.stringify(remoteData)); // 同步到本地
                    }
                }, err => console.warn("Firebase offline, using local storage."));
                
                return () => unsub();
            }, []);

            // 2. 時鐘與語音
            useEffect(() => {
                const tick = () => {
                    const now = new Date();
                    setCurrentTime(`${now.getHours() >= 12 ? '下午' : '上午'} ${now.getHours() % 12 || 12}:${now.getMinutes().toString().padStart(2, '0')}`);
                };
                tick();
                const timer = setInterval(tick, 10000);

                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SR) {
                    recognitionRef.current = new SR();
                    recognitionRef.current.lang = 'zh-TW';
                    recognitionRef.current.onresult = (e) => setTranscript(e.results[0][0].transcript);
                    recognitionRef.current.onerror = () => setIsListening(false);
                    recognitionRef.current.onend = () => setIsListening(false);
                }
                return () => clearInterval(timer);
            }, []);

            // --- 核心修正：100% 成功存檔 ---
            const saveToCloud = async (textToSave) => {
                if (!selectedCharacter) return;
                
                const charData = allProgress[selectedCharacter] || { completed: [], records: {} };
                const newCompleted = [...new Set([...(charData.completed || []), currentLevelIdx])];
                const updatedRecords = { ...(charData.records || {}), [currentLevelIdx]: textToSave };
                
                const newData = {
                    ...allProgress,
                    [selectedCharacter]: { completed: newCompleted, records: updatedRecords }
                };

                // 第一重保險：立刻更新畫面狀態
                setAllProgress(newData);
                
                // 第二重保險：立刻存入瀏覽器快取 (電視重開機都在)
                localStorage.setItem('emotion_adventure_data', JSON.stringify(newData));

                // 第三重保險：背景寫入 Firebase
                try {
                    await db.collection('GameData').doc(DB_COLLECTION).set({ students: newData }, { merge: true });
                } catch (e) {
                    console.warn("Firebase sync delayed, saved locally.");
                }

                setGameState('LEVEL_SELECT');
            };

            const startListening = () => {
                if (!recognitionRef.current || isListening) return;
                setTranscript('');
                setIsListening(true);
                try { recognitionRef.current.start(); } catch (e) { setIsListening(false); }
            };

            const CharacterAvatar = ({ name, className = "w-28 h-28" }) => {
                const char = CHARACTER_DATA.find(c => c.name === name);
                const [err, setErr] = useState(false);
                return (
                    <div className={`${className} rounded-full overflow-hidden border-4 border-white shadow-inner bg-indigo-50 flex items-center justify-center`}>
                        {!err && char?.img ? <img src={char.img} className="w-full h-full object-cover" onError={() => setErr(true)} /> : <span className="text-3xl text-indigo-200 font-bold">{name[0]}</span>}
                    </div>
                );
            };

            const StarsDisplay = ({ count }) => (
                <div className="flex flex-wrap justify-center gap-1 mt-2">
                    {[...Array(10)].map((_, i) => (
                        <span key={i} className={`text-xl transition-all ${i < count ? 'text-yellow-400 star-animate' : 'text-slate-200'}`}>★</span>
                    ))}
                </div>
            );

            // --- 介面渲染 ---
            return (
                <div className="h-full w-full flex flex-col relative overflow-hidden bg-slate-50">
                    {/* 頂部進度條 */}
                    {(gameState === 'PLAYING' || gameState === 'LEVEL_SELECT') && (
                        <div className="w-full h-4 bg-white shadow-sm overflow-hidden z-10">
                            <div className="h-full bg-gradient-to-r from-indigo-400 to-indigo-600 transition-all duration-1000" style={{ width: `${((allProgress[selectedCharacter]?.completed?.length || 0) / 10) * 100}%` }} />
                        </div>
                    )}

                    <div className="flex-grow overflow-hidden relative">
                        {/* 1. 大廳選人 */}
                        {gameState === 'CHARACTER_SELECT' && (
                            <div className="h-full flex flex-col items-center justify-between py-10 px-12 bg-gradient-to-br from-indigo-50 to-white">
                                <div className="text-center"><h2 className="text-5xl font-black text-slate-800 tracking-widest mt-4">誰要來接受挑戰？</h2><p className="text-slate-400 font-bold mt-2 text-xl">點擊同學照片即可進入「冒險地圖」</p></div>
                                <div className="grid grid-cols-4 gap-8 w-full max-w-6xl">
                                    {CHARACTER_DATA.map((char) => (
                                        <div key={char.name} className="bg-white p-6 rounded-[3.5rem] shadow-lg border-[8px] border-white hover:border-indigo-100 transition-all flex flex-col items-center justify-center min-h-[230px] cursor-pointer active:scale-95" 
                                             onClick={() => { setSelectedCharacter(char.name); setGameState('LEVEL_SELECT'); }}>
                                            <CharacterAvatar name={char.name} />
                                            <span className="text-4xl font-black text-slate-700 mt-2">{char.name}</span>
                                            <StarsDisplay count={allProgress[char.name]?.completed?.length || 0} />
                                        </div>
                                    ))}
                                </div>
                                <div className="w-full flex justify-center pb-6">
                                    <button onClick={() => { setSelectedCharacter(null); setGameState('SUMMARY'); }} className="bg-indigo-600 text-white px-16 py-6 rounded-[3rem] font-black text-3xl active:scale-95 shadow-xl hover:bg-indigo-700 transition-colors">📊 檢視全班總結看板</button>
                                </div>
                            </div>
                        )}

                        {/* 2. 紀錄看板 */}
                        {gameState === 'SUMMARY' && (
                            <div className="h-full p-8 overflow-hidden flex flex-col">
                                <div className="flex items-center justify-between mb-6 px-4"><button onClick={() => setGameState('CHARACTER_SELECT')} className="text-3xl font-black text-indigo-600 bg-white px-10 py-4 rounded-[2.5rem] shadow-md active:scale-95">← 返回首頁</button><h2 className="text-5xl font-black text-slate-800">全班發表紀錄回顧</h2><div className="w-40" /></div>
                                <div className="flex-grow overflow-y-auto no-scrollbar pb-24 px-4"><div className="grid gap-8 max-w-5xl mx-auto">
                                    {(selectedCharacter ? [selectedCharacter] : CHARACTERS).map(name => (
                                        <div key={name} className="bg-white rounded-[4rem] p-10 shadow-xl border-2 border-indigo-50">
                                            <div className="flex items-center justify-between border-b-4 border-slate-50 pb-6 mb-6">
                                                <div className="flex items-center gap-6"><CharacterAvatar name={name} className="w-20 h-20" /><span className="text-5xl font-black text-slate-800">{name}</span></div>
                                                <span className="text-yellow-500 font-black text-4xl italic">★ {allProgress[name]?.completed?.length || 0} 關</span>
                                            </div>
                                            <div className="grid gap-6">
                                                {allProgress[name]?.completed?.length > 0 ? allProgress[name].completed.sort((a,b)=>a-b).map(idx => (
                                                    <div key={idx} className="bg-indigo-50/50 p-8 rounded-[3rem] flex flex-col gap-4">
                                                        <div className="flex items-center gap-4 text-3xl font-black text-indigo-600"><span>{SCENARIOS[idx].emoji}</span> 第 {idx + 1} 關</div>
                                                        <p className="text-4xl font-black text-slate-700 bg-white p-6 rounded-[2rem] shadow-sm leading-relaxed">「{allProgress[name].records[idx]}」</p>
                                                    </div>
                                                )) : <p className="text-center text-slate-300 py-6 text-3xl font-bold italic">目前尚未有存檔紀錄</p>}
                                            </div>
                                        </div>
                                    ))}
                                </div></div>
                            </div>
                        )}

                        {/* 3. 選關地圖 */}
                        {gameState === 'LEVEL_SELECT' && (
                            <div className="h-full flex flex-col items-center p-8 overflow-hidden">
                                <div className="flex items-center justify-between w-full max-w-7xl mb-8 px-4">
                                    <button onClick={() => setGameState('CHARACTER_SELECT')} className="text-3xl font-black text-slate-400 bg-white px-8 py-4 rounded-[2rem] shadow-sm active:scale-95">← 回選單</button>
                                    <h2 className="text-5xl font-black text-slate-800 flex items-center gap-6"><CharacterAvatar name={selectedCharacter} className="w-24 h-24" /><span className="text-indigo-600 underline underline-offset-8 decoration-indigo-200">{selectedCharacter}</span> 的冒險地圖</h2>
                                    <button onClick={() => setGameState('SUMMARY')} className="bg-indigo-100 text-indigo-600 px-10 py-4 rounded-[2rem] font-black text-2xl shadow-sm active:scale-95">📜 個人歷史</button>
                                </div>
                                <div className="grid grid-cols-5 gap-6 w-full max-w-7xl flex-grow content-center">
                                    {SCENARIOS.map((s, idx) => (
                                        <button key={s.id} onClick={() => { setCurrentLevelIdx(idx); setGameState('PLAYING'); setTranscript(allProgress[selectedCharacter]?.records?.[idx] || ''); }} 
                                            className={`relative h-[13rem] rounded-[4rem] flex flex-col items-center justify-center gap-3 transition-all shadow-xl border-[10px] active:scale-95 ${allProgress[selectedCharacter]?.completed?.includes(idx) ? 'bg-green-50 border-green-400 text-green-700' : 'bg-white border-white hover:border-indigo-200'}`}>
                                            <span className="text-[5.5rem] leading-none">{s.emoji}</span><span className="font-black text-2xl">第 {idx+1} 關</span>
                                            {allProgress[selectedCharacter]?.completed?.includes(idx) && <div className="absolute top-4 right-4 text-green-500"><svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 4. 遊玩與編輯面 (動態排版解決覆蓋問題) */}
                        {gameState === 'PLAYING' && (
                            <div className="h-full flex flex-col items-center justify-center p-6 overflow-hidden">
                                <div className="w-full max-w-[95vw] flex justify-between items-center mb-2 px-4">
                                    <button onClick={() => setGameState('LEVEL_SELECT')} className="text-2xl font-bold text-indigo-600 bg-white px-8 py-3 rounded-2xl shadow-md active:scale-95">← 返回地圖</button>
                                    <div className="flex items-center gap-4 bg-white px-6 py-2 rounded-full border-2 border-indigo-50 shadow-sm"><CharacterAvatar name={selectedCharacter} className="w-12 h-12" /><span className="font-black text-2xl text-slate-700">{selectedCharacter} 的挑戰</span></div>
                                </div>

                                <div className="bg-white rounded-[4rem] shadow-2xl overflow-hidden w-full max-w-[95vw] flex flex-1 max-h-[80vh] border-b-[20px] border-indigo-200">
                                    <div className="w-[30%] bg-indigo-600 flex flex-col items-center justify-center p-6 text-center text-white relative">
                                        <div className="text-[14rem] mb-6 drop-shadow-2xl">{SCENARIOS[currentLevelIdx].emoji}</div>
                                        <div className="bg-white/20 px-8 py-3 rounded-full text-3xl font-black uppercase">LEVEL {currentLevelIdx + 1}</div>
                                    </div>
                                    <div className="w-[70%] p-8 flex flex-col items-center overflow-hidden">
                                        <div className="bg-slate-50 rounded-[3rem] p-8 border-4 border-slate-100 w-full text-center shadow-inner mb-6"><h3 className="text-4xl font-black text-gray-700 leading-snug">「{SCENARIOS[currentLevelIdx].text}」</h3></div>
                                        <p className="text-indigo-600 font-black text-3xl text-center mb-6">{SCENARIOS[currentLevelIdx].hint}</p>

                                        {/* 動態區塊：如果有文字就縮小麥克風，放大輸入框 */}
                                        <div className="flex flex-col w-full flex-1 gap-4 justify-end pb-4">
                                            {transcript || allProgress[selectedCharacter]?.records?.[currentLevelIdx] ? (
                                                // 編輯模式
                                                <div className="flex flex-col gap-4 flex-1 h-full">
                                                    <div className="bg-indigo-50/50 w-full p-6 rounded-[2.5rem] border-[6px] border-indigo-200 shadow-inner flex flex-col flex-1">
                                                        <div className="flex justify-between items-center border-b-4 border-white pb-3 mb-3">
                                                            <p className="text-indigo-500 text-2xl font-black flex items-center gap-2"><span>💬</span> 敘述內容 (點擊可修正)：</p>
                                                            <button onClick={startListening} className={`px-6 py-2 rounded-xl font-bold text-xl transition-colors ${isListening ? 'bg-red-500 text-white animate-pulse' : 'bg-white text-indigo-600 shadow-sm border-2 border-indigo-100 hover:bg-indigo-100'}`}>
                                                                {isListening ? "聽寫中..." : "重新語音輸入"}
                                                            </button>
                                                        </div>
                                                        <textarea className="w-full flex-1 text-5xl font-black text-indigo-900 text-center bg-transparent border-none focus:ring-0 resize-none no-scrollbar leading-normal min-h-[120px]" 
                                                                  value={transcript} onChange={(e) => setTranscript(e.target.value)} placeholder="等待輸入中..." />
                                                    </div>
                                                    {!isListening && (
                                                        <button onClick={() => saveToCloud(transcript)} className="w-full bg-green-500 hover:bg-green-600 text-white font-black py-8 rounded-[3rem] text-4xl shadow-[0_10px_30px_rgba(34,197,94,0.4)] active:scale-95 transition-all">
                                                            ✔ 確認發表並儲存紀錄
                                                        </button>
                                                    )}
                                                </div>
                                            ) : (
                                                // 錄音模式
                                                <div className="flex items-center gap-10 bg-indigo-50 p-10 rounded-[4rem] border-4 border-indigo-100 w-full justify-center shadow-sm">
                                                    <button onClick={startListening} disabled={isListening} className={`relative w-40 h-40 rounded-full flex items-center justify-center transition-all duration-300 ${isListening ? 'bg-red-500 scale-110 shadow-[0_0_50px_rgba(239,68,68,0.7)]' : 'bg-indigo-600 hover:bg-indigo-700 shadow-xl active:scale-90'}`}>
                                                        {isListening && <div className="absolute inset-0 rounded-full animate-ping bg-red-400 opacity-75 scale-125"></div>}
                                                        <div className="text-white relative z-10 scale-[2]"><svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg></div>
                                                    </button>
                                                    <div className="text-left"><p className={`text-6xl font-black ${isListening ? 'text-red-500 animate-pulse' : 'text-slate-400'}`}>{isListening ? "正在傾聽..." : "點擊麥克風說話"}</p></div>
                                                </div>
                                            )}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* 底部狀態列 */}
                    <div className="h-16 bg-white flex items-center justify-between px-16 border-t-4 border-slate-100 z-50 shadow-[0_-4px_10px_rgba(0,0,0,0.02)]">
                         <div className="bg-indigo-600 text-white px-8 py-1.5 rounded-2xl font-black text-2xl tabular-nums shadow-sm">{currentTime}</div>
                         <span className="text-slate-300 font-black tracking-[1.5em] text-lg uppercase hidden lg:inline tracking-tighter">Emotion Adventure • Dual Engine</span>
                         <div className="bg-indigo-50 px-8 py-1.5 rounded-2xl font-black text-indigo-400 text-xl shadow-inner">
                             {selectedCharacter ? `${selectedCharacter} 已完成：${allProgress[selectedCharacter]?.completed?.length || 0}/10` : "等待同學挑戰"}
                         </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
