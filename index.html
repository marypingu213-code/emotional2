<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>情緒大冒險 - 互動點名與永久紀錄</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');
        
        body, html { 
            margin: 0; padding: 0; height: 100vh; width: 100vw; 
            overflow: hidden; 
            font-family: 'Noto Sans TC', sans-serif; 
            background-color: #F8FAFC;
            user-select: none;
            touch-action: none;
        }
        #root { height: 100%; width: 100%; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .wheel-spin { transition: transform 4s cubic-bezier(0.15, 0, 0.15, 1); }
        
        @keyframes star-pop { 0% { transform: scale(0); } 80% { transform: scale(1.3); } 100% { transform: scale(1); } }
        .star-animate { animation: star-pop 0.5s ease-out forwards; }
        
        @keyframes pointer-wiggle { 0%, 100% { transform: translateX(-50%) rotate(0deg); } 50% { transform: translateX(-50%) rotate(10deg); } }
        .pointer-animate { animation: pointer-wiggle 0.2s infinite; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 1. Firebase 設定 (已導入您的控制碼) ---
        const firebaseConfig = {
            apiKey: "AIzaSyBdioCJeP0FbZvX_opzhrgsgQ5OtQR5J_Y",
            authDomain: "emotionadventure-bca46.firebaseapp.com",
            projectId: "emotionadventure-bca46",
            storageBucket: "emotionadventure-bca46.firebasestorage.app",
            messagingSenderId: "255312343191",
            appId: "1:255312343191:web:ac90f2cbb36296edbdf9d2",
            measurementId: "G-D7WVZ0SQBL"
        };

        // --- 2. 人物資料 (確保順序與轉盤一致) ---
        const CHARACTER_DATA = [
            { name: "沄恩", img: "spic/1.jpg" },
            { name: "澄洋", img: "spic/2.jpg" },
            { name: "意欣", img: "spic/3.jpg" },
            { name: "宇晴", img: "spic/4.jpg" },
            { name: "齊安", img: "spic/5.jpg" },
            { name: "欽銓", img: "spic/6.jpg" },
            { name: "盧楷", img: "spic/7.jpg" }
        ];
        const CHARACTERS = CHARACTER_DATA.map(c => c.name);

        const SCENARIOS = [
            { id: 1, text: "我和同學玩遊戲輸了，我覺得心裡酸酸的。", emoji: "🎮", hint: "輸掉遊戲時，你會怎麼跟自己說？" },
            { id: 2, text: "今天早上我上課遲到了，進教室時看到大家都在看我。", emoji: "⏰", hint: "遲到的時候，你想跟老師說什麼？" },
            { id: 3, text: "上課要寫字時，我發現我忘了帶鉛筆盒。", emoji: "✏️", hint: "沒帶工具時，該怎麼辦呢？" },
            { id: 4, text: "老師叫我上台發表，但我好害羞，不敢看大家。", emoji: "🫣", hint: "心裡很緊張的時候，可以做什麼動作？" },
            { id: 5, text: "下課排隊玩溜滑梯，前面的同學動作好慢喔。", emoji: "⏳", hint: "等待時，心裡可以想些什麼？" },
            { id: 6, text: "同學不小心撞到我，他趕快跟我說對不起。", emoji: "🕊️", hint: "對方道歉了，你會怎麼回應他？" },
            { id: 7, text: "教室裡面突然好吵好大聲，我覺得耳朵痛痛的。", emoji: "🙉", hint: "覺得不舒服時，你會怎麼尋求幫忙？" },
            { id: 8, text: "我畫了一張好漂亮的畫，老師把它貼在公佈欄給大家看。", emoji: "🖼️", hint: "被稱讚的時候，你現在的心情是..." },
            { id: 9, text: "午餐的湯不小心灑在衣服上了，濕濕黏黏的。", emoji: "🥣", hint: "衣服髒了很不舒服，該怎麼解決呢？" },
            { id: 10, text: "同學跟我借彩色筆，我也借給他一起用。", emoji: "🖍️", hint: "分享東西給別人，你覺得現在的心情是..." }
        ];

        // 初始化 Firebase
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const auth = firebase.auth();
        const appId = "persistence_v10"; // 更新 appId 確保結構乾淨

        function App() {
            const [user, setUser] = useState(null);
            const [gameState, setGameState] = useState('CHARACTER_SELECT'); 
            const [selectedCharacter, setSelectedCharacter] = useState(null);
            const [currentLevelIdx, setCurrentLevelIdx] = useState(0);
            const [isListening, setIsListening] = useState(false);
            const [transcript, setTranscript] = useState('');
            const [feedback, setFeedback] = useState({ type: '', message: '' });
            const [allProgress, setAllProgress] = useState({});
            const [currentTime, setCurrentTime] = useState('');
            
            const [showWheel, setShowWheel] = useState(false);
            const [wheelRotation, setWheelRotation] = useState(0);
            const [isSpinning, setIsSpinning] = useState(false);

            const recognitionRef = useRef(null);

            // 1. 初始化登入與資料監聽
            useEffect(() => {
                auth.signInAnonymously();
                const unsubAuth = auth.onAuthStateChanged(u => setUser(u));
                return () => unsubAuth();
            }, []);

            useEffect(() => {
                if (!user) return;
                const docRef = db.collection('artifacts').doc(appId).collection('public').doc('data');
                return docRef.onSnapshot(snap => {
                    if (snap.exists) setAllProgress(snap.data().students || {});
                    else {
                        const init = {};
                        CHARACTERS.forEach(c => init[c] = { completed: [], records: {} });
                        setAllProgress(init);
                    }
                });
            }, [user]);

            // 2. 工具類初始化
            useEffect(() => {
                const tick = () => {
                    const now = new Date();
                    setCurrentTime(`${now.getHours() >= 12 ? '下午' : '上午'} ${now.getHours() % 12 || 12}:${now.getMinutes().toString().padStart(2, '0')}`);
                };
                tick();
                const timer = setInterval(tick, 10000);

                const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (SR) {
                    recognitionRef.current = new SR();
                    recognitionRef.current.lang = 'zh-TW';
                    recognitionRef.current.onresult = (e) => {
                        setTranscript(e.results[0][0].transcript);
                        setFeedback({ type: 'success', message: '錄音成功！' });
                    };
                    recognitionRef.current.onerror = () => setIsListening(false);
                    recognitionRef.current.onend = () => setIsListening(false);
                }
                return () => clearInterval(timer);
            }, []);

            // 3. 核心修正功能：穩定的雲端存檔
            const saveToCloud = async (textToSave) => {
                if (!user || !selectedCharacter) return;
                
                const charData = allProgress[selectedCharacter] || { completed: [], records: {} };
                const newCompleted = [...new Set([...charData.completed, currentLevelIdx])];
                const updatedRecords = { ...charData.records, [currentLevelIdx]: textToSave };
                
                const updatedStudents = {
                    ...allProgress,
                    [selectedCharacter]: { completed: newCompleted, records: updatedRecords }
                };

                try {
                    await db.collection('artifacts').doc(appId).collection('public').doc('data').set({
                        students: updatedStudents
                    }, { merge: true });
                    setGameState('LEVEL_SELECT');
                } catch (e) {
                    alert("雲端同步失敗，請檢查網路連線。");
                }
            };

            // 4. 核心修正功能：精準轉盤公式
            const spin = () => {
                if (isSpinning) return;
                setIsSpinning(true);
                // 轉動基礎角度 (2880 = 8圈) + 隨機角度
                const randomExtra = Math.floor(Math.random() * 360);
                const newRot = wheelRotation + 2880 + randomExtra;
                setWheelRotation(newRot);

                setTimeout(() => {
                    setIsSpinning(false);
                    const sliceDeg = 360 / CHARACTERS.length;
                    // 修正：計算旋轉後落在最頂部 (0度) 的索引
                    // 轉盤順時針轉，索引計算需反向
                    const normalizedRot = newRot % 360;
                    const winningIndex = Math.floor(((360 - normalizedRot) % 360) / sliceDeg);
                    const winner = CHARACTERS[winningIndex];
                    
                    setTimeout(() => {
                        setSelectedCharacter(winner);
                        setGameState('LEVEL_SELECT');
                        setShowWheel(false);
                    }, 800);
                }, 4100);
            };

            const startListening = () => {
                if (!recognitionRef.current || isListening) return;
                setTranscript('');
                setFeedback({ type: '', message: '' });
                setIsListening(true);
                try { recognitionRef.current.start(); } catch (e) { setIsListening(false); }
            };

            const CharacterAvatar = ({ name, className = "w-28 h-28" }) => {
                const char = CHARACTER_DATA.find(c => c.name === name);
                const [err, setErr] = useState(false);
                return (
                    <div className={`${className} rounded-full overflow-hidden border-4 border-white shadow-inner bg-indigo-50 flex items-center justify-center`}>
                        {!err && char?.img ? <img src={char.img} className="w-full h-full object-cover" onError={() => setErr(true)} /> : <span className="text-3xl text-indigo-200">👤</span>}
                    </div>
                );
            };

            return (
                <div className="h-full w-full flex flex-col relative overflow-hidden">
                    {/* 進度條 */}
                    {(gameState === 'PLAYING' || gameState === 'LEVEL_SELECT') && (
                        <div className="w-full h-6 bg-white shadow-sm overflow-hidden">
                            <div className="h-full bg-gradient-to-r from-indigo-400 to-indigo-600 transition-all duration-1000" style={{ width: `${((allProgress[selectedCharacter]?.completed.length || 0) / 10) * 100}%` }} />
                        </div>
                    )}

                    <div className="flex-grow overflow-hidden relative">
                        {/* 首頁 */}
                        {gameState === 'CHARACTER_SELECT' && (
                            <div className="h-full flex flex-col items-center justify-between py-10 px-12 bg-gradient-to-br from-indigo-50 to-white">
                                <div className="text-center"><h2 className="text-5xl font-black text-slate-800 tracking-widest mt-4">情緒冒險：誰來應戰？</h2><p className="text-slate-400 font-bold mt-2 italic">點擊相片可直接挑戰，或使用轉盤抽籤</p></div>
                                <div className="grid grid-cols-4 gap-6 w-full max-w-6xl">
                                    {CHARACTER_DATA.map((char) => (
                                        <div key={char.name} className="bg-white p-6 rounded-[3rem] shadow-lg border-[8px] border-white hover:border-indigo-100 transition-all flex flex-col items-center justify-center min-h-[220px] cursor-pointer active:scale-95" onClick={() => { setSelectedCharacter(char.name); setGameState('LEVEL_SELECT'); }}>
                                            <CharacterAvatar name={char.name} />
                                            <span className="text-4xl font-black text-slate-700 mt-2">{char.name}</span>
                                            <div className="flex gap-1 mt-2">{[...Array(10)].map((_, i) => <span key={i} className={`text-xl ${i < (allProgress[char.name]?.completed.length || 0) ? 'text-yellow-400 star-animate' : 'text-slate-200'}`}>★</span>)}</div>
                                        </div>
                                    ))}
                                </div>
                                <div className="w-full flex justify-between items-end px-4">
                                    <button onClick={() => { setSelectedCharacter(null); setGameState('SUMMARY'); }} className="bg-white border-2 border-slate-200 text-slate-400 px-10 py-5 rounded-3xl font-black text-2xl active:scale-95 shadow-sm">📊 檢視紀錄看板</button>
                                    <button onClick={() => setShowWheel(true)} className="bg-indigo-600 text-white px-14 py-10 rounded-[4rem] text-5xl font-black shadow-2xl active:scale-90 flex items-center gap-6 animate-pulse">🎡 啟動幸運轉盤</button>
                                </div>
                                {showWheel && (
                                    <div className="fixed inset-0 bg-black/80 z-[100] flex items-center justify-center backdrop-blur-md">
                                        <div className="bg-white p-12 rounded-[5rem] flex flex-col items-center gap-12 relative border-[12px] border-indigo-50 shadow-2xl max-w-2xl w-full">
                                            <button onClick={() => !isSpinning && setShowWheel(false)} className="absolute top-10 right-10 text-5xl text-slate-200">✕</button>
                                            <h3 className="text-5xl font-black text-slate-800">命運大點名</h3>
                                            <div className="relative w-[450px] h-[450px] flex items-center justify-center">
                                                <div className={`absolute top-[-50px] z-50 text-red-600 text-9xl ${isSpinning ? 'pointer-animate' : ''}`} style={{left: '50%', transform: 'translateX(-50%)'}}>▼</div>
                                                <div className="w-full h-full rounded-full border-[15px] border-indigo-600 wheel-spin shadow-2xl overflow-hidden bg-white relative" style={{ transform: `rotate(${wheelRotation}deg)` }}>
                                                    {CHARACTERS.map((name, i) => <div key={name} className="absolute w-full h-full flex justify-center pt-10 origin-center" style={{ transform: `rotate(${i * (360/CHARACTERS.length)}deg)` }}><span className="font-black text-4xl text-indigo-900">{name}</span></div>)}
                                                </div>
                                            </div>
                                            <button onClick={spin} disabled={isSpinning} className={`px-24 py-10 rounded-[3rem] text-5xl font-black text-white ${isSpinning ? 'bg-slate-300' : 'bg-red-500 active:scale-95 transition-all shadow-xl'}`}>{isSpinning ? "旋轉中..." : "開始轉動"}</button>
                                        </div>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* 紀錄看板 */}
                        {gameState === 'SUMMARY' && (
                            <div className="h-full bg-slate-50 p-8 overflow-hidden flex flex-col">
                                <div className="flex items-center justify-between mb-8 px-4"><button onClick={() => setGameState('CHARACTER_SELECT')} className="text-3xl font-black text-indigo-600 bg-white px-8 py-4 rounded-3xl shadow-md active:scale-95">← 返回大廳</button><h2 className="text-5xl font-black text-slate-800">全班發表紀錄回顧</h2><div className="w-40" /></div>
                                <div className="flex-grow overflow-y-auto no-scrollbar pb-24 px-4"><div className="grid gap-8 max-w-5xl mx-auto">
                                    {(selectedCharacter ? [selectedCharacter] : CHARACTERS).map(name => (
                                        <div key={name} className="bg-white rounded-[4rem] p-10 shadow-xl border-2 border-indigo-50">
                                            <div className="flex items-center justify-between border-b-4 border-slate-50 pb-6 mb-6"><div className="flex items-center gap-6"><CharacterAvatar name={name} className="w-20 h-20" /><span className="text-5xl font-black text-slate-800">{name}</span></div><span className="text-yellow-500 font-black text-4xl italic">★ {allProgress[name]?.completed.length || 0}</span></div>
                                            <div className="grid gap-6">{allProgress[name]?.completed.length > 0 ? allProgress[name].completed.sort((a,b)=>a-b).map(idx => (
                                                <div key={idx} className="bg-indigo-50/50 p-8 rounded-[3rem] flex flex-col gap-4">
                                                    <div className="flex items-center gap-4 text-3xl font-black text-indigo-600"><span>{SCENARIOS[idx].emoji}</span> 第 {idx + 1} 關</div>
                                                    <p className="text-4xl font-black text-slate-700 bg-white p-6 rounded-[2rem] shadow-sm leading-relaxed">「{allProgress[name].records[idx]}」</p>
                                                </div>
                                            )) : <p className="text-center text-slate-300 py-10 text-3xl font-bold italic">尚無歷史紀錄</p>}</div>
                                        </div>
                                    ))}
                                </div></div>
                            </div>
                        )}

                        {/* 選關 */}
                        {gameState === 'LEVEL_SELECT' && (
                            <div className="h-full flex flex-col items-center p-8 bg-slate-50 overflow-hidden">
                                <div className="flex items-center justify-between w-full max-w-7xl mb-8 px-4"><button onClick={() => setGameState('CHARACTER_SELECT')} className="text-3xl font-black text-slate-400 px-6 py-4 active:scale-95">← 返回首頁</button><h2 className="text-5xl font-black text-slate-800 flex items-center gap-6"><CharacterAvatar name={selectedCharacter} className="w-24 h-24" /><span className="text-indigo-600 underline underline-offset-8 decoration-indigo-200">{selectedCharacter}</span> 的冒險圖</h2><button onClick={() => setGameState('SUMMARY')} className="bg-indigo-50 text-indigo-600 px-10 py-4 rounded-3xl font-black text-2xl shadow-sm active:scale-95">📜 查看歷史發表</button></div>
                                <div className="grid grid-cols-5 gap-8 w-full max-w-7xl flex-grow content-center">
                                    {SCENARIOS.map((s, idx) => (
                                        <button key={s.id} onClick={() => { setCurrentLevelIdx(idx); setGameState('PLAYING'); setTranscript(allProgress[selectedCharacter]?.records[idx] || ''); setFeedback({type:'', message:''}); }} className={`relative h-60 rounded-[4rem] flex flex-col items-center justify-center gap-3 transition-all shadow-xl border-[10px] active:scale-90 ${allProgress[selectedCharacter]?.completed.includes(idx) ? 'bg-green-50 border-green-400 text-green-700' : 'bg-white border-white hover:border-indigo-200'}`}>
                                            <span className="text-8xl">{s.emoji}</span><span className="font-black text-3xl">第 {idx+1} 關</span>
                                            {allProgress[selectedCharacter]?.completed.includes(idx) && <div className="absolute top-4 right-4 text-green-500"><svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="4" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></div>}
                                        </button>
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* 遊玩與編輯 */}
                        {gameState === 'PLAYING' && (
                            <div className="h-full flex flex-col items-center justify-center p-6 bg-indigo-50 overflow-hidden">
                                <div className="w-full max-w-[95vw] flex justify-between items-center mb-2 px-6"><button onClick={() => setGameState('LEVEL_SELECT')} className="text-2xl font-bold text-indigo-600 bg-white px-8 py-3 rounded-2xl shadow-md active:bg-slate-50">← 返回地圖</button><div className="flex items-center gap-4 bg-white/80 px-6 py-2 rounded-full border border-white shadow-sm"><CharacterAvatar name={selectedCharacter} className="w-12 h-12" /><span className="font-black text-2xl text-slate-700">{selectedCharacter} 的挑戰</span></div></div>
                                <div className="bg-white rounded-[5rem] shadow-2xl overflow-hidden w-full max-w-[95vw] flex flex-1 max-h-[75vh] border-b-[20px] border-indigo-200">
                                    <div className="w-[35%] bg-indigo-600 flex flex-col items-center justify-center p-8 text-center text-white relative">
                                        <div className="text-[18rem] mb-8 drop-shadow-2xl">{SCENARIOS[currentLevelIdx].emoji}</div>
                                        <div className="bg-white/20 px-10 py-4 rounded-full text-4xl font-black">LEVEL {currentLevelIdx + 1}</div>
                                    </div>
                                    <div className="w-[65%] p-10 flex flex-col justify-between items-center overflow-hidden">
                                        <div className="bg-slate-50 rounded-[4rem] p-10 border-4 border-slate-100 w-full text-center shadow-inner flex flex-col justify-center min-h-[180px]"><h3 className="text-5xl font-black text-gray-700 leading-snug">「{SCENARIOS[currentLevelIdx].text}」</h3></div>
                                        <div className="flex flex-col items-center gap-6 w-full"><p className="text-indigo-600 font-black text-4xl text-center">{SCENARIOS[currentLevelIdx].hint}</p>
                                            <div className="flex items-center gap-10 bg-indigo-50/50 p-8 rounded-[4rem] border-2 border-indigo-100 w-full justify-center shadow-sm">
                                                <button onClick={startListening} disabled={isListening} className={`relative w-44 h-44 rounded-full flex items-center justify-center transition-all duration-300 ${isListening ? 'bg-red-500 scale-110 shadow-[0_0_60px_rgba(239,68,68,0.7)]' : 'bg-indigo-600 shadow-xl active:scale-90'}`}>
                                                    {isListening && <div className="absolute inset-0 rounded-full animate-ping bg-red-400 opacity-75 scale-125"></div>}
                                                    <div className="text-white relative z-10 scale-[2.2]"><svg xmlns="http://www.w3.org/2000/svg" width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg></div>
                                                </button>
                                                <div className="text-left"><p className={`text-6xl font-black ${isListening ? 'text-red-500 animate-pulse' : 'text-slate-400'}`}>{isListening ? "正在傾聽..." : "點擊錄音"}</p><p className="text-2xl text-slate-300 mt-2 font-bold decoration-indigo-100 italic">點擊下方文字框可手動修正內容</p></div>
                                            </div>
                                        </div>
                                        <div className="h-[220px] w-full flex flex-col items-center justify-center text-center gap-4">
                                            <div className="bg-white w-full px-10 py-6 rounded-[3rem] border-[8px] border-indigo-200 shadow-2xl flex flex-col gap-2 relative">
                                                <p className="text-indigo-400 text-2xl font-black border-b-2 border-slate-50 pb-2 mb-2 flex items-center justify-center gap-2"><span>💬</span> 學生說的話：</p>
                                                <textarea className="w-full text-5xl font-black text-indigo-900 text-center bg-transparent border-none focus:ring-0 resize-none h-32 no-scrollbar leading-relaxed" value={transcript} onChange={(e) => setTranscript(e.target.value)} placeholder="等待輸入中..." />
                                            </div>
                                            {transcript.length > 0 && !isListening && <button onClick={() => saveToCloud(transcript)} className="bg-green-500 hover:bg-green-600 text-white font-black py-8 px-20 rounded-[3rem] text-5xl shadow-xl active:scale-95 transition-all flex items-center gap-6 shadow-[0_10px_30px_rgba(34,197,94,0.4)]">確認發表並儲存紀錄</button>}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>

                    {/* 狀態欄 */}
                    <div className="h-20 bg-white flex items-center justify-between px-20 border-t-2 border-slate-100 z-50 shadow-inner">
                         <div className="bg-indigo-600 text-white px-8 py-2 rounded-2xl font-black text-4xl tabular-nums shadow-lg">{currentTime}</div>
                         <span className="text-slate-200 font-black tracking-[1.2em] text-xl uppercase hidden lg:inline tracking-tighter">Emotion Adventure • Persistent Data</span>
                         <div className="bg-indigo-50 px-8 py-2 rounded-2xl font-black text-indigo-400 text-2xl shadow-inner">{selectedCharacter ? `${selectedCharacter} 已挑戰：${allProgress[selectedCharacter]?.completed.length || 0} 關` : "準備開始挑戰"}</div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
